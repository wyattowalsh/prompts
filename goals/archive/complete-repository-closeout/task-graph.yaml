        - everyGithubRunCheckStatusObjectReferencesFinalSha
        - vercelDeploymentAndAliasReferenceFinalSha
        - activeCursorBuildReferencesFinalSha
        - paginationCompleteForEveryRemoteCollection
        - evidenceFreshAtCloseout
        - everyPreTerminalEvidenceArtifactDigestVerified
        - terminalTailIntegrityChainValid
        - compiledGraphAndRuntimeBundleDigestsMatch
        - terminalDependencyAncestorSetExactAndComplete
        - candidateLineageContiguousAndGitVerified
        - successfulLocalWaveLedgerAndSupersedingReceiptsComplete
        - warnings == 0
        - errors == 0
      receipt: .audit/complete-repository-closeout/receipts/goal.done.json
      timeoutSeconds: 1800
      retry: { maxAttempts: 1, transientOnly: true }
      onFailure: { stopBarrier: true }
  localRepairWaveTemplate:
    parameter: M
    requires: M > previousLocalRepairWave
    instantiateWhen: a repository-caused node failure strictly before the active graph's commit boundary
    mergeOrder: [commonNode, preset, waveNode]
    expandedNodeContract: spec.nodeContract.requiredFields
