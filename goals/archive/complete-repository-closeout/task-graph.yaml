        reads: [.audit/complete-repository-closeout/**, '{causalPaths[*].path}']
        writes: ['.audit/complete-repository-closeout/local-wave-{M}/{id}.json', '{causalPaths[*].path}']
        locks: ['path:{causalPaths[*].realpath}']
        action: Complete or repair the failed local work only on the diagnosis-bound path set.
        verify: [noWritesOutsideHydratedLeases, candidateCommitCountUnchanged, regressionAddedWhereApplicable]
      runtime-snapshot:
        kind: write
        owner: local-runtime-input-snapshotter
        authority: { localRead: exact-live-bundle-inputs, localWrite: exact-wave-local-runtime-input-snapshot, gitMutation: false, productionMutation: false }
        reads: ['{runtimeLiveInputs[*]}']
        writes: ['{runtimeInputSnapshotPaths[*]}']
        locks: ['{runtimeLocks[*]}']
        action: While holding the exact bundle-selected snapshot locks, enumerate, copy, byte-digest, sync, and atomically publish one immutable wave-local runtime-input manifest and file set before producer dispatch.
        verify: [liveInputsEqualBundleSelection, regularNonSymlinkContainedFilesOnly, snapshotManifestCompleteAndCanonicallyOrdered, everyCopiedByteDigestVerified, snapshotPublishedAtomically, noProducerDispatchedBeforeSnapshot, warnings == 0, errors == 0]
