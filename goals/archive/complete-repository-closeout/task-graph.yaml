    presets:
      diagnose:
        kind: read
        owner: local-repair-diagnostician
        action: Bind the exact failed receipt, source graph and commit boundary, causal paths, invalidated completed receipts, and one exclusive local writer without resolving the failed source node.
        verify: [failedReceiptDigestVerified, sourceBeforeSelectedCommitBoundary, causalPathsExact, invalidationSetComplete]
