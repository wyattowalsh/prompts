            - { dataset: finalClaimCensus, flag: --final-claim-census, originalPath: .audit/complete-repository-closeout/final-claim-census.json }
            - { dataset: finalClaimSourcePairs, flag: --final-source-pairs, originalPath: .audit/complete-repository-closeout/final-claim-source-pairs.json }
            - { dataset: publishedClaimCensus, flag: --published-claim-census, originalPath: .audit/complete-repository-closeout/final-claim-census.json }
          committed:
