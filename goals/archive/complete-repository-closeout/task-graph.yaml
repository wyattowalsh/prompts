      failedReceiptSnapshotTemplate: '.audit/complete-repository-closeout/local-wave-{M}/failed-node-receipt.json'
      diagnosisArtifactTemplate: '.audit/complete-repository-closeout/local-wave-{M}/localrepair.{M}.diagnose.json'
      diagnoseDispatchRequiresFailedReceipt: true
      downstreamDispatchRequiresDiagnosis: true
      failedReceiptFields: [nodeId, sourceGraph, resumeGraph, commitBoundaryId, candidateEpoch, parentLocalWave, priorLocalWaveChain, decisionBundleDigest, inputTree, sourceSnapshotManifestPath, sourceSnapshotManifestDigest, artifactDigest, causeClass, observedAt]
      diagnosisFields: [nodeId, sourceGraph, resumeGraph, commitBoundaryId, candidateEpoch, localRepairWave, failedNodeReceiptDigest, causalPaths, invalidatedNodeIds, invalidatedReceipts, observedAt]
      causalPathFields: [path, baselineDigest, reason]
      invalidatedReceiptFields: [nodeId, pathKey, receiptPath, receiptDigest, inputTree, status]
      invalidatedReceiptPathKey: lowercase sha256 of exact nodeId
      causalPathConstraints:
        - causalPaths is nonempty
        - paths are unique exact repo-relative files with no glob or parent traversal
        - paths exclude .git, the ignored audit root, and broad roots
        - realpaths or nearest existing ancestors remain inside the repository
        - existing bytes match baselineDigest and new paths record absent
        - ancestor and descendant paths cannot both be leased
      invalidationConstraints:
        - invalidatedNodeIds is nonempty, unique, and includes the failed node
        - invalidatedReceipts is nonempty and its nodeId projection equals invalidatedNodeIds exactly
        - every invalidated receipt uses the compiled node's exact receipt path and byte digest
        - exactly the failed source entry has status failed and equals the immutable failed-node receipt identity
        - every other invalidated receipt has status resolved or authorized-skipped under its compiled condition
        - every invalidated node belongs to sourceGraph or resumeGraph and is before the diagnosis-bound commit boundary
        - a higher local wave inherits resumeGraph, commitBoundaryId, and candidateEpoch exactly from the failed prior wave
        - a higher local wave may invalidate source-wave nodes plus newly stale resume-graph nodes, but its resume-graph invalidation set is disjoint from every ancestor diagnosis invalidation set
        - ancestor-owned invalidated nodes remain pending and are regenerated exactly once by that ancestor after child-wave release
        - every completed receipt whose read/write lease overlaps a causal path is included
        - every completed transitive descendant whose input closure or produced artifact is stale is included
        - every completed freeze, validator, build, browser, or hook receipt bound to the prior tree fingerprint is included
        - no unaffected receipt is silently rewritten
