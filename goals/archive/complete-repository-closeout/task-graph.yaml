          published: [.audit/complete-repository-closeout/final-claim-census.json, .audit/complete-repository-closeout/final-claim-source-pairs.json, .audit/complete-repository-closeout/source-postcutover-parity.json]
          committed: [.audit/complete-repository-closeout/final-claim-census.json, .audit/complete-repository-closeout/final-claim-source-pairs.json, .audit/complete-repository-closeout/source-postcutover-parity.json]
