apiVersion: goals.w4w.dev/v1
kind: TaskGraph
metadata:
  id: complete-repository-closeout
  repository: .
  requiredBranch: main
  decisionBundle:
    facts: goals/complete-repository-closeout/facts.md
    decisionAddendum: goals/complete-repository-closeout/decision-addendum.md
    migration: goals/complete-repository-closeout/migration-ledger.yaml
    migrationNarrative: goals/complete-repository-closeout/catalog-migration-ledger.md
    discovery: goals/complete-repository-closeout/discovery-ledger.md
    research: goals/complete-repository-closeout/research.md
    plan: goals/complete-repository-closeout/plan.md
    graph: goals/complete-repository-closeout/task-graph.yaml
    graphValidator: goals/complete-repository-closeout/validate-task-graph.mjs
  coordinatorSlots: 1
  maximumWorkerSlots: 3
spec:
  decisionBundleDigestContract:
    entriesFrom: metadata.decisionBundle
    exactEntryFields: [key, path, sha256]
    pathRequirements: [repository-relative, realpath-contained, regular-file, non-symlink]
    byteDigest: lowercase sha256 of exact file bytes
    canonicalDigest: lowercase sha256 of canonical JSON records sorted by key then path
    graphAndValidatorBytesIncluded: true
    graphCompileReportRecordsCanonicalDigest: true
    everyExecutionFailedLogicalResolutionTerminalAndBindingArtifactMustMatch: true
    uniformlyForgedOrCross-bundleDigestRejected: true
    materialBundleChangeInvalidatesAllActivePromptsAndReceipts: true
  datasets:
    initialSources:
      fromArtifact: sources.yaml
      selector: $[*]
      snapshotBy: baseline.freeze
      key: id
      assertCount: 124
    inputAssets:
      fromArtifact: goals/complete-repository-closeout/migration-ledger.yaml
      derive: clusters[*].members union singletons[*]
      key: kind+slug
      assertCount: 91
    playbooks:
      fromArtifact: goals/complete-repository-closeout/migration-ledger.yaml
      selector: clusters[*]
      key: canonical_slug
      derivedFields:
        memberPaths: members[*] -> catalog/{kind}s/{slug}.yaml
        producerNode: playbook.propose.{canonical_slug}
        proposalOrNativePath: goals/complete-repository-closeout/staging/playbooks/{canonical_slug}.yaml
        path: goals/complete-repository-closeout/staging/playbooks/{canonical_slug}.yaml
      assertCount: 23
    singletons:
      fromArtifact: goals/complete-repository-closeout/migration-ledger.yaml
      selector: singletons[*]
      key: kind+slug
      assertCount: 35
    outputs:
      fromArtifact: goals/complete-repository-closeout/migration-ledger.yaml
      derive:
        - clusters[*] as kind=playbook, slug=canonical_slug
        - singletons[*] retaining kind and slug
      derivedFields:
        producerNode: >-
          playbook.propose.{slug} for playbooks; singleton.review.{kind}.{slug}
          for singletons
        proposalOrNativePath: >-
          goals/complete-repository-closeout/staging/playbooks/{slug}.yaml for
          playbooks; catalog/{kind}s/{slug}.yaml for singletons
        publishedPath: >-
          catalog/playbooks/{slug}.yaml for playbooks;
          catalog/{kind}s/{slug}.yaml for singletons
        path: >-
          goals/complete-repository-closeout/staging/playbooks/{slug}.yaml for
          playbooks; catalog/{kind}s/{slug}.yaml for singletons
      key: slug
      assertCount: 58
    retiredTypedRoutes:
      fromArtifact: goals/complete-repository-closeout/migration-ledger.yaml
      derive: typed route for every inputAssets item union public_contract.retired_typed_indexes
      key: path
      derivedFields:
        pathHash: sha256(path) truncated to 16 lowercase hex characters
      assertCount: 93
    researchTopics:
      inline:
        - reasoning-search-literature
        - anthropic-multi-agent-guidance
        - google-multi-agent-guidance
        - agents-lane-eval-metadata
        - named-prompt-engineering-residuals
        - openai-llms-extracts-and-gap-discovery
      assertCount: 6
    componentCases:
      inline:
        - command-palette
        - catalog-preview
        - theme-menu
        - fill-copy-composer
        - route-focus-overlay
      assertCount: 5
    finalClaimSourcePairs:
      producedBy: sources.final.discover
      fromArtifact: .audit/complete-repository-closeout/final-claim-source-pairs.json
      key: pairId
      requiredFields: [pairId, outputSlug, claimId, assetPath, fieldLocator, claimDigest, sourceId, sourceUrl, sourceLocator, sourceFingerprint, hostname]
      minimumCount: 1
      coverageRule: every source-bearing final claim across all 58 outputs has at least one pair
      assertCountFromArtifact: true
      postProductionValidation:
        cliFlag: --final-source-pairs
        artifactShape: JSON array of finalClaimSourcePairs records
        coverageKey: assetPath
        coverageTargets: outputs[*].proposalOrNativePath
        requiredOutputCount: 58
        requireUniquePairIds: true
        requireEveryOutputCovered: true
        claimCensusDataset: finalClaimCensus[*].sourceClaims
        requireEveryCensusClaimCovered: true
        rejectOrphanPairs: true
        resolveClaimLocatorsAndDigests: true
        claimIdDerivation: sha256(outputSlug + NUL + RFC6901 fieldLocator) as 16 lowercase hex
    acceptedOutputChanges:
      producedBy: output.review.join
      fromArtifact: .audit/complete-repository-closeout/output-decisions.json
      key: slug
      assertCount: 58
      requiredFields: [slug, kind, path, decision]
      hydration:
        cliFlag: --accepted-output-changes
        artifactShape: JSON array of acceptedOutputChanges records
        compilerNode: output.apply.compile
        exactOutputSet: true
        dispatchRequiresHydratedCompilation: true
    finalClaimCensus:
      producedBy: sources.final.census
      fromArtifact: .audit/complete-repository-closeout/final-claim-census.json
      key: slug
      assertCount: 58
      requiredFields: [slug, kind, assetPath, publishedPath, assetDigest, sourceClaims]
      claimCensus:
        requiredFields: [claimId, fieldLocator, claimDigest]
        minimumClaimsPerOutput: 1
        claimIdsUniqueWithinOutput: true
        fieldLocatorFormat: RFC-6901-JSON-Pointer
        fieldLocatorTargetType: string
        claimDigestFormat: lowercase-hex-sha256
        claimDigestInput: exact UTF-8 bytes of the resolved string with no normalization
        assetDigestFormat: lowercase-hex-sha256
        assetDigestInput: exact regular non-symlink file bytes
        resolveLocatorsAgainstAsset: true
        verifyAssetAndClaimDigests: true
        claimIdDerivation: sha256(slug + NUL + RFC6901 fieldLocator) as 16 lowercase hex
      postProductionValidation:
        cliFlag: --final-claim-census
        artifactShape: JSON array of finalClaimCensus records
        exactOutputSet: true
        independentFromPairArtifact: true
        postCutoverCliFlag: --published-claim-census
        requirePublishedPathDigestParity: true
    commitGroups:
      producedBy: commits.construct
      fromArtifact: .audit/complete-repository-closeout/commit-plan.json
      key: sha
      minimumCount: 1
      assertCountFromArtifact: true
      requiredFields: [sha, parentSha, message, paths, focusedCommands]
      hydration:
        cliFlag: --commit-groups
        artifactShape: JSON array of commitGroups records
        compilerNode: commits.compile
        dispatchRequiresHydratedCompilation: true
        requireUniqueShas: true
        requireLinearParentChain: true
        requireConventionalMessages: true
        requireGitObjectsExist: true
        requireActualSingleParentAndMessage: true
        requireLastShaEqualsHead: true
        requireExactChangedPathSets: true
    liveCases:
      inline:
        - desktop-light-catalog
        - desktop-dark-catalog
        - mobile-light-navigation
        - mobile-dark-navigation
        - composer-modes-modules-copy
        - palette-preview-explore-focus
        - keyboard-a11y-reduced-motion
        - privacy-console-network-seo
      assertCount: 8
    functionalRoutes:
      fromArtifact: goals/complete-repository-closeout/migration-ledger.yaml
      selector: public_contract.retained_functional_redirects[*]
      key: source
      derivedFields:
        sourceHash: sha256(source) truncated to 16 lowercase hex characters
      assertCount: 2
  resources:
    node-modules: { capacity: 1 }
    catalog-index: { capacity: 1 }
    catalog-live-tree: { capacity: 1 }
    source-manifest: { capacity: 1 }
    readme-output: { capacity: 1 }
    site-data-pair: { capacity: 1 }
    web-dist: { capacity: 1 }
    browser-server: { capacity: 1 }
    app-router: { capacity: 1 }
    global-css: { capacity: 1 }
    root-docs: { capacity: 1 }
    goal-ledgers: { capacity: 1 }
    local-repair-chain: { capacity: 1 }
    git-index: { capacity: 1 }
    temp-clone: { capacity: 1 }
    origin-main-push: { capacity: 1 }
    github-api: { capacity: 2 }
    vercel-api: { capacity: 1 }
    cursor-cloud: { capacity: 1 }
    production-http: { capacity: 3 }
    network-host:
      capacityPerKey: 2
      keyExpression: item.hostname
  evidencePolicy:
    trackedDecisionRoot: goals/complete-repository-closeout
    ignoredRuntimeRoot: .audit/complete-repository-closeout
    ignoredByGit: true
    mutableCompletionStateTracked: false
    trackedWritesAfterCandidatePush: forbidden-within-that-candidate-epoch
    higherEpochCausalForwardFixes: allowed-before-next-forward-fix-commit
    postLiveReconciliationRequired: true
    terminalEvidenceTail:
      inventoryBoundary: artifacts finalized before postlive.reconcile.epochN writes its own receipt
      allowlistedAfterInventory:
        - postlive.reconcile.epochN node receipt
        - active-successful-epoch.json
        - completion-receipt.json
        - goal.done node receipt
      integrityChain:
        - postlive reconciliation inventories and digests every preceding artifact
        - active epoch binding digests the finalized postlive node receipt
        - goal.done verifies the binding and every preceding digest before emitting terminal receipts
      selfDigestExemption: an evidence artifact never claims to include or digest itself
      writesAfterGoalDone: forbidden
    rule: >-
      Durable decisions and specifications may be committed before the release
      SHA. Mutable execution receipts, fetched bodies, logs, screenshots,
      clean clones, remote attempts, and post-SHA completion state stay in the
      ignored audit root and never create a self-referential evidence commit. A
      higher epoch may change exact causal tracked paths only before creating
      its new conventional forward-fix commit; no tracked write follows that
      epoch's push.
  nodeContract:
    requiredFields:
      - id
      - phase
      - kind
      - needs
      - owner
      - authority
      - reads
      - writes
      - locks
      - action
      - produces
      - verify
      - receipt
      - timeoutSeconds
      - retry
      - onFailure
    allowedKinds: [read, write, join, barrier, assure, external-monitor, manual]
    receiptFields:
      - schemaVersion
      - nodeId
      - nodeContractDigest
      - decisionBundleDigest
      - owner
      - status
      - startedAt
      - finishedAt
      - inputTree
      - touchedPaths
      - diffSummary
      - commands
      - results
      - warnings
      - errors
      - residualRisks
      - discoveredDependencies
      - artifactPaths
      - candidateEpoch
      - inputSha
      - pushedSha
      - observedAt
      - evidenceExpiry
      - attempt
      - providerObjectIds
      - paginationComplete
      - artifactDigests
      - dependencyReceiptDigests
      - externalInputDigests
      - candidateLineageDigest
      - localWaveLedgerDigest
      - terminalDependencyClosureDigest
      - compiledGraphDigest
      - runtimeBundleDigest
      - waveExecutionClosureDigest
    receiptCompletionContract:
      schemaVersion: 1
      terminalStatuses: [resolved, skipped]
      failedSnapshotStatus: failed
      dependencyEntryFields: [nodeId, receiptPath, receiptDigest, status]
      externalInputEntryFields: [name, path, digest]
      nodeContractDigest: sha256 of the canonical compiled node contract
      dependencySetMustEqualCompiledNeeds: true
      everyDependencyAndExternalInputByteDigestVerified: true
      everyDeclaredOutputAndArtifactByteDigestVerified: true
      receiptNeverDigestsItself: true
      resolvedRequiresAllVerifyResultsTrue: true
      skippedRequiresExplicitCompiledConditionAndDisposition: true
      warningsAndErrorsMustBeEmptyArrays: true
      candidateShaAndTreeIdentityMustMatchNodePhase: true
      recursiveClosureMustTerminateAtGraphRootOrVerifiedExternalSourceSnapshot: true
      failedSnapshotMustBindItsCompleteSuccessfulDependencyClosure: true
    compileRules:
      - ids are unique after foreach expansion
      - every dependency resolves to one expanded node
      - graph is acyclic inside each candidate epoch
      - every barrier is an instantiated node
      - every foreach expansion has exactly one explicit join
      - every join asserts expected, dispatched, resolved, skipped, and failed counts
      - concurrent write paths are realpath-disjoint
      - a writer excludes readers requiring the same stable snapshot
      - file and non-file leases are released before downstream dispatch
      - shared output and Git operations have capacity one
      - failure routes to the declared monotonic local wave or candidate epoch without a backward edge
      - a skipped conditional predecessor has a receipt and satisfies downstream dependency resolution
      - dispatched minus resolved minus skipped is zero at every barrier
  invariants:
    catalog:
      inputAssets: 91
      clusteredMembers: 56
      playbookClusters: 23
      singletonAssets: 35
      outputAssets: 58
      outputKinds: { recipe: 24, pattern: 11, playbook: 23 }
      equations:
        - 56 + 35 == 91
        - 23 + 35 == 58
    routes:
      browse: /catalog/
      detailTemplate: /catalog/{slug}/
      canonicalDetailCount: 58
      retiredTypedRouteCount: 93
      catalogCompatibilityRedirects: 0
      catalogCompatibilityAliases: 0
      retainedFunctionalRedirects: 2
      removedTypedRoutesReturn: 404
    composer:
      modeCount: 1..6
      moduleCount: 0..12
      selectedModes: 1
      freeTextShareSinks: 0
      providerPromptQuerySinks: 0
    releaseOrderEpoch0:
      - writes.freeze
      - local.validation.green
      - origin.precommit.drift
      - commits.construct
      - commits.reviewed
      - cleanclone.final
      - github.expected
      - origin.prepush.drift
      - push.initial
      - remote.green.epoch0
      - live.green.epoch0
      - postlive.reconcile.epoch0
      - goal.done
    graphStatisticsRequired:
      - templateNodes
      - expandedNodes
      - edges
      - roots
      - terminalNodes
      - criticalPathNodes
      - maximumReadyWidth
      - unresolvedDependencyRefs
      - cycles
      - overlappingWriteLeases
      - unjoinedExpansions
      - dispatchedMinusResolved
      - expectedMinimumExpandedNodes >= 600
      - expectedMinimumReadyWidth >= 130
    postHydrationStructuralOracle:
      modes: [static, accepted, final-sources, published-only, committed, local-repair, candidate-repair, active-terminal]
      rerunAfterEveryDeferredRuntimeAndResolutionHydration: true
      require: [one-root, one-terminal, zero-unresolved-dependencies, zero-cycles, zero-write-lock-resource-authority-conflicts, every-foreach-has-exact-join, goal-done-dispatchability-matches-mode]
      reportFields: [concreteNodeCount, concreteEdgeCount, rootIds, terminalIds, criticalPathNodes, maximumReadyWidth, sortedConcreteNodeIdsDigest, compiledGraphDigest, hydratedDatasetCounts, hydratedSourcePairIdsDigest, hydratedResolutionIdsDigest]
      mutateAnyEffectiveNodeContractOrDependencyChangesCompiledGraphDigest: true
      yamlKeyCommentOrOrderingOnlyChangeDoesNotChangeCompiledGraphDigest: true
  defaults:
    authority:
      branches: forbidden
      worktrees: forbidden
      productionMutation: forbidden
      forcePush: forbidden
      secretOutput: forbidden
    receipt: .audit/complete-repository-closeout/receipts/{id}.json
    retry: { maxAttempts: 1, transientOnly: true }
    onFailure: { stopBarrier: true, preserveEvidence: true }
  runtimeVariables:
    activeSuccessfulEpoch:
      default: 0
      cliFlag: --active-epoch
      receiptFlag: --active-epoch-receipt
      localWaveLedgerFlag: --local-wave-ledger
      localWaveLedgerPath: .audit/complete-repository-closeout/successful-local-waves.json
      ignoredBinding: .audit/complete-repository-closeout/active-successful-epoch.json
      goalDoneDispatchRequiresReceipt: true
      staticCompilationGoalDoneDispatchable: false
      trackedMutationForbidden: true
      terminalReceiptPathEpoch0: .audit/complete-repository-closeout/receipts/postlive.reconcile.epoch0.json
      terminalReceiptPathTemplate: .audit/complete-repository-closeout/receipts/epoch-{N}/postlive.reconcile.epoch{N}.json
      terminalReceiptIdentityFields: { node: nodeId, epoch: candidateEpoch, sha: pushedSha }
      terminalReceiptDigestFormat: lowercase-hex-sha256
      candidateShaFormat: lowercase-40-hex-git-object-id
      observedAtFormat: ISO-8601
      verifyTerminalReceiptDigest: true
      verifyCandidateShaMatch: true
      requiredReceiptFields: [activeSuccessfulEpoch, previousCandidateEpoch, terminalNodeId, terminalReceiptDigest, terminalDependencyClosureDigest, compiledGraphDigest, runtimeBundleDigest, candidateSha, candidateLineageDigest, localWaveLedgerDigest, observedAt]
      higherEpochRequiredReceiptFields: [failedNodeReceiptDigest, repairDiagnosisDigest]
      lineageAndClosureDigestFormat: lowercase-hex-sha256
      candidateLineageContractRef: repairEpochTemplate.runtimeCompilation.priorCandidateReplay
      localWaveLedger:
        artifactShape: JSON array canonically ordered by localRepairWave
        requiredEntryFields: [localRepairWave, sourceGraph, resumeGraph, commitBoundaryId, candidateEpoch, outcome, failedReceiptPath, failedReceiptDigest, sourceSnapshotManifestPath, sourceSnapshotManifestDigest, diagnosisPath, diagnosisDigest, resumeReceiptPath, resumeReceiptDigest, waveExecutionClosureDigest, waveExecutionReceiptCount, receiptResolutions]
        receiptResolutionFields: [nodeId, pathKey, resolutionMode, priorReceiptPath, priorReceiptDigest, recheckExecutionReceiptPath, recheckExecutionReceiptDigest, projectionExecutionReceiptPath, projectionExecutionReceiptDigest, resolutionArtifactPath, resolutionArtifactDigest, selectedTerminalReceiptPath, selectedTerminalReceiptDigest, inputTree]
        resolutionModes:
          logical-replacement:
            terminalSelection: resolutionArtifact
            requiresOriginalContractProjection: true
          historical-state-verified:
            terminalSelection: priorHistoricalReceipt
            requiresOriginalContractProjection: false
            exactOneWayAllowlistOnly: true
        logicalResolutionArtifact:
          schemaVersion: 1
          requiredFields: [schemaVersion, resolutionMode, originalNodeId, originalNodeContractDigest, decisionBundleDigest, priorReceiptPath, priorReceiptDigest, inputTree, status, logicalDependencyReceiptDigests, originalVerifyResults, recheckExecutionReceiptPath, recheckExecutionReceiptDigest]
          logicalDependencyEntryFields: [nodeId, resolutionMode, selectedPath, selectedDigest, status]
          allowedLogicalDependencyResolutionModes: [standard-receipt, logical-replacement, historical-state-verified]
          originalNeedsAndVerifySetsMustBeExact: true
          logicalDependenciesUseFinalResolutionSubstitutionForEveryOriginalNeed: true
          recheckExecutionReceiptByteDigestVerified: true
          projectionExecutionReceiptBindsArtifactDigestViaLedger: true
          artifactNeverDigestsItsOwnProjectionReceipt: true
        historicalStateArtifact:
          schemaVersion: 1
          requiredFields: [schemaVersion, resolutionMode, originalNodeId, decisionBundleDigest, historicalReceiptPath, historicalReceiptDigest, historicalInputTree, currentInputTree, status, stateProofResults, recheckExecutionReceiptPath, recheckExecutionReceiptDigest]
          selectedTerminalReceiptRemainsHistorical: true
          historicalReceiptMustMatchRecordedOriginalPhaseAndTree: true
          currentStateExecutionProjectionAndArtifactMustMatchCurrentRepairedTreeAndCandidate: true
          stateProofMustMatchExactOneWayPolicy: true
          originalContractReplacementForbidden: true
        allowedOutcomes: [resolved, superseded]
        exactStartedWaveSetRequired: true
        atomicIdempotentUpsertThenCanonicalSort: true
        conflictingDuplicateWaveRejected: true
        midRepairCompletedSetMayExcludeOnlyExactActiveAncestorChainAndCurrentWave: true
        completedAndActiveWaveSetsMustBeDisjoint: true
        everyWaveExecutionResolutionAndSelectedReceiptByteDigestVerified: true
        waveExecutionClosureIncludedNodes: [diagnose, apply, runtime input snapshot, every condition-resolved-or-authorized-skipped runtime producer, runtime compile, every concrete runtime source pair, runtime source join, runtime publish, focused, every recheck execution, every projection execution, supersede join]
        waveExecutionClosureExcludedAndSeparatelyBoundNodes: [resume, ledger.append]
        noUnresolvedOrActiveWaveAtTerminal: true
        terminalGraphUsesFinalLogicalResolutionOrHistoricalReceiptForEachInvalidatedNode: true
      terminalDependencyClosure:
        root: 'postlive.reconcile.epoch{activeSuccessfulEpoch}'
        closureStartsAtRootDependencies: true
        excludeRootReceiptFromClosureDigestToAvoidSelfReference: true
        rootReceiptIsBoundOnlyByActiveEpochTerminalReceiptDigest: true
        closureRecordFields: [nodeId, receiptPath, receiptDigest, status, nodeContractDigest, decisionBundleDigest, inputTree, candidateSha, warnings, errors, resolutionMode, resolutionArtifactDigest, recheckExecutionReceiptDigest, projectionExecutionReceiptDigest]
        traverse: resolution-aware standard receipt, logical-resolution, or historical-state branch
        resolutionAwareTraversal:
          standard-receipt: validate nodeContract.receiptCompletionContract then traverse dependencyReceiptDigests and externalInputDigests
          logical-replacement: validate the exact logicalResolutionArtifact schema and original compiled contract, traverse its final-substituted logicalDependencyReceiptDigests, then validate and traverse the ledger-bound recheck and projection standard execution receipts
          historical-state-verified: keep and traverse the historical standard receipt for the original graph dependency, then validate and traverse the exact one-way state recheck and projection execution receipts from the ledger-bound historicalStateArtifact
        resolutionModeAndArtifactDigestIncludedInClosureDigest: true
        nonGenericResolutionArtifactMustNeverEnterStandardReceiptBranch: true
        exactCompiledDependencySetAtEveryNode: true
        exactFullyHydratedAncestorNodeSetAndCountRequired: true
        compiledGraphDigest: sha256 of canonical sorted concrete node IDs, dependencies, and node contract digests
        runtimeBundleDigest: sha256 of canonical current dataset, source snapshot, local-wave ledger, and candidate-lineage digests
        closureDigest: sha256 of canonical sorted closure records
        readAndHashEveryReferencedReceipt: true
        requireResolvedOrAuthorizedSkippedStatus: true
        requireNodeContractDigestAndDecisionBundleDigest: true
        requireCandidateShaAndTreeIdentityByResolutionBranch: true
        historicalBranchAllowsOnlyRecordedHistoricalReceiptTreeWhileCurrentStateProofMatchesCurrentTreeAndCandidate: true
        requireAllVerifyResultsTrueAndWarningsErrorsEmpty: true
        requireExactShaProviderAndLiveSuccessSemantics: true
        terminateOnlyAtGraphRootOrVerifiedSourceSnapshot: true
      resolution: >-
        Compile the fixed graph against epoch 0. Before resolving goal.done after
        a repair, load the ignored binding receipt, compile repair epoch N, and
        bind goal.done to postlive.reconcile.epochN without changing tracked YAML.
      goalDoneCompileCommands:
        epoch0: >-
          node goals/complete-repository-closeout/validate-task-graph.mjs --check
          --json
          --accepted-output-changes=.audit/complete-repository-closeout/output-decisions.json
          --final-claim-census=.audit/complete-repository-closeout/final-claim-census.json
          --final-source-pairs=.audit/complete-repository-closeout/final-claim-source-pairs.json
          --published-claim-census=.audit/complete-repository-closeout/final-claim-census.json
          --commit-groups=.audit/complete-repository-closeout/commit-plan.json
          --local-wave-ledger=.audit/complete-repository-closeout/successful-local-waves.json
          --active-epoch=0
          --active-epoch-receipt=.audit/complete-repository-closeout/active-successful-epoch.json
        higherEpochTemplate: >-
          node goals/complete-repository-closeout/validate-task-graph.mjs --check
          --json
          --accepted-output-changes=.audit/complete-repository-closeout/output-decisions.json
          --final-claim-census=.audit/complete-repository-closeout/final-claim-census.json
          --final-source-pairs=.audit/complete-repository-closeout/final-claim-source-pairs.json
          --published-claim-census=.audit/complete-repository-closeout/final-claim-census.json
          --commit-groups=.audit/complete-repository-closeout/commit-plan.json
          --repair-epoch={N}
          --failed-node-receipt=.audit/complete-repository-closeout/epoch-{N}/failed-node-receipt.json
          --repair-diagnosis=.audit/complete-repository-closeout/epoch-{N}/repair.{N}.diagnose.json
          --repair-source-snapshot=.audit/complete-repository-closeout/epoch-{N}/source-snapshot/manifest.json
          --local-wave-ledger=.audit/complete-repository-closeout/successful-local-waves.json
          --active-epoch={N}
          --active-epoch-receipt=.audit/complete-repository-closeout/active-successful-epoch.json
  nodes:
    - id: graph.compile
      phase: baseline
      kind: assure
      needs: []
      owner: graph-compiler
      authority: { localRead: true, localWrite: ignored-audit-only }
      reads: [goals/complete-repository-closeout/**, goals/complete-repository-closeout/validate-task-graph.mjs, sources.yaml, catalog/**, .gitignore]
      writes: [.audit/complete-repository-closeout/compiled-graph.json]
      locks: [goal-ledgers]
      action: Compile all fixed datasets and foreach nodes, register deferred datasets, evaluate conditions and joins, and reject structural ambiguity before repository inspection.
      command: node goals/complete-repository-closeout/validate-task-graph.mjs --check --json
      produces: [compiled-graph]
      verify:
        - decisionBundleDigestRecorded
        - process.version == v24.18.0
        - fixedDatasetsExpanded
        - deferredDatasetsHaveProducerAndJoin
        - expandedNodes >= 600
        - maximumReadyWidth >= 130
        - unresolvedDependencyRefs == 0
        - cycles == 0
        - overlappingWriteLeases == 0
        - unjoinedExpansions == 0
        - missingReceiptContracts == 0
      receipt: .audit/complete-repository-closeout/receipts/graph.compile.json
      timeoutSeconds: 1800
      retry: { maxAttempts: 1, transientOnly: true }
      onFailure: { stopBarrier: true }
    - id: baseline.inspect
      phase: baseline
      kind: read
      needs: [graph.compile]
      owner: coordinator
      authority: { localRead: true }
      reads: [AGENTS.md, goals/complete-repository-closeout/**, .git]
      writes: []
      locks: []
      action: Read all instructions, facts, ledgers, branch, status, remotes, tools, and relevant processes.
      produces: [baseline-observations]
      verify: [branch == main, instructionsComplete, secretsNotPrinted]
      receipt: .audit/complete-repository-closeout/receipts/baseline.inspect.json
      timeoutSeconds: 900
      retry: { maxAttempts: 1, transientOnly: true }
      onFailure: { stopBarrier: true }
    - id: dirty.audit
      phase: baseline
      kind: read
      needs: [baseline.inspect]
      owner: dirty-reviewer
      authority: { localRead: true }
      reads: ['**']
      writes: [.audit/complete-repository-closeout/dirty-audit.json]
      locks: [goal-ledgers]
      action: Fingerprint and disposition every tracked, staged, untracked, ignored, temporary, and goal artifact.
