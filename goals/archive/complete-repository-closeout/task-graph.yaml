          published: every finalClaimCensus publishedPath
          committed: every finalClaimCensus publishedPath
        sourceCompatibility:
          none: source is output.apply.compile or precedes it
          accepted: source is sources.final.compile or follows output.apply.compile and precedes sources.final.compile
          final-sources: source is sources.postcutover.verify or follows sources.final.compile and does not follow sources.postcutover.verify
          published: source follows sources.postcutover.verify in the base graph and precedes commits.construct
          committed: source belongs to repair-epoch-{N} after the base commit graph compiled
        highestCompletedBarrierSelectsExactBundle: true
