          selectedBundleFromVerifiedSourceSnapshot: true
          replaceDoNotSupplementFields: [reads, writes, locks]
          snapshotReadsMustEqualLiveInputsByBundle: true
          producerReadsMustEqualRuntimeInputSnapshotCopiesPlusDependencyCandidateArtifacts: true
          producerWritesRestrictedToExactWaveLocalCandidateOrPairArtifact: true
          publishWritesRestrictedToAtomicCurrentOutputsByBundle: true
          locksMustEqualNodeRoleAndBundleMap: true
          unresolvedSelectorAfterHydrationFailsClosed: true
        immutableInputs: [sourceSnapshot, snapshottedLocalWaveLedger]
        preservedCurrentArtifacts: [acceptedOutputChanges, currentLocalWaveLedger, commitGroups, candidateLineage]
        trackedSourceEvidenceChangeSpawnsHigherLocalWaveWithExactCausalPaths: true
        externalSourceOutageIsNamedBlocker: true
