          compile: '.audit/complete-repository-closeout/local-wave-{M}/runtime-candidates/compile.json'
          sourceLeaf: '.audit/complete-repository-closeout/local-wave-{M}/runtime-final-source-checks/{pairId}.json'
          sourceJoin: '.audit/complete-repository-closeout/local-wave-{M}/runtime-final-source-checks.join.json'
