        requireExactWritesResolutionsAndInvalidationJoin: true
        recheckInducedSubgraphDependencies: each recheck execution depends on focused plus recheck executions for its invalidated compiled predecessors
        projectionInducedSubgraphDependencies: each projection depends on its recheck execution plus projections for its invalidated compiled predecessors
        exactResolutionCardinalityEqualsInvalidatedNodeIds: true
