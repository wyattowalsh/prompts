          accepted: ['.audit/complete-repository-closeout/local-wave-{M}/source-snapshot/manifest.json', .audit/complete-repository-closeout/successful-local-waves.json, .audit/complete-repository-closeout/output-decisions.json]
          final-sources: ['.audit/complete-repository-closeout/local-wave-{M}/source-snapshot/manifest.json', .audit/complete-repository-closeout/successful-local-waves.json, .audit/complete-repository-closeout/output-decisions.json, goals/complete-repository-closeout/staging/**, sources.yaml, source-refresh.md]
          published: ['.audit/complete-repository-closeout/local-wave-{M}/source-snapshot/manifest.json', .audit/complete-repository-closeout/successful-local-waves.json, .audit/complete-repository-closeout/output-decisions.json, catalog/**, sources.yaml, source-refresh.md]
          committed: ['.audit/complete-repository-closeout/local-wave-{M}/source-snapshot/manifest.json', .audit/complete-repository-closeout/successful-local-waves.json, .audit/complete-repository-closeout/output-decisions.json, .audit/complete-repository-closeout/commit-plan.json, .audit/complete-repository-closeout/active-successful-epoch.json, catalog/**, sources.yaml, source-refresh.md]
