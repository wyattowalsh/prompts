        kind: write
        owner: local-runtime-evidence-producer
        authority: { localRead: exact-hydrated-bundle-inputs, localWrite: exact-wave-local-runtime-candidate, gitMutation: false, productionMutation: false }
        reads: ['{runtimeInputs[*]}']
        writes: ['{runtimeCandidateOutputs[*]}']
        locks: ['{runtimeLocks[*]}']
        action: Produce one independently receipted wave-local runtime candidate from the exact bundle-selected current inputs, or emit an authorized skipped execution receipt when its bundle condition is false.
        verify: [bundleConditionExact, actualReadsEqualHydratedInputs, actualWritesEqualHydratedWaveLocalOutputs, immutableInputsUnchanged, warnings == 0, errors == 0]
      runtime-compile:
        kind: assure
        owner: local-runtime-compiler
        authority: { localRead: exact-wave-local-runtime-candidates, localWrite: exact-wave-local-runtime-compile-artifact, gitMutation: false }
        reads: ['{runtimeInputs[*]}']
        writes: ['{runtimeCandidateOutputs[*]}']
        locks: ['{runtimeLocks[*]}']
        action: Cross-check the independently produced current census and pairs, plus published parity when required, then hydrate the exact pair dataset for leaf dispatch.
        verify: [bundleConditionExact, censusPairsIndependentAndComplete, publishedParityConditionExact, refreshedPairIdsUniqueAndComplete, warnings == 0, errors == 0]
      runtime-source:
        kind: assure
        owner: local-runtime-source-worker
        authority: { networkRead: official-or-proposed-url, localWrite: exact-wave-local-source-evidence, gitMutation: false }
        reads: ['{runtimeInputs[*]}']
        writes: ['{runtimeCandidateOutputs[*]}']
        locks: ['{runtimeLocks[*]}']
        resources: ['network-host:{pair.hostname}']
        action: Verify one exact refreshed claim/source pair and retain its independent verdict and retry history.
        verify: [pairIdentityExact, claimDigestMatches, sourceIdentityMatches, sourceLocatorSupportsClaim, contentSupportReviewed, verdictComplete]
      runtime-source-join:
        kind: join
        owner: local-runtime-source-captain
        authority: { localRead: exact-wave-local-source-evidence, localWrite: exact-wave-local-source-join-artifact, gitMutation: false }
        reads: ['{runtimeInputs[*]}']
        writes: ['{runtimeCandidateOutputs[*]}']
        locks: ['{runtimeLocks[*]}']
        action: Join every refreshed pair leaf with exact expected, dispatched, resolved, skipped, failed, and pair-ID projection accounting.
        verify: [expected == refreshedPairCount, dispatched == expected, resolved == expected, skipped == 0, failed == 0, pairIdProjectionExact]
      runtime-publish:
        kind: write
        owner: local-runtime-evidence-publisher
        authority: { localRead: exact-wave-local-runtime-candidates, localWrite: exact-current-ignored-runtime-outputs, gitMutation: false, productionMutation: false }
        reads: ['{runtimeInputs[*]}']
        writes: ['{runtimeCurrentOutputs[*]}']
        locks: ['{runtimeLocks[*]}']
        action: After the exact runtime source join, atomically publish only the bundle-authorized current ignored outputs; early bundles publish nothing and every immutable or preserved artifact remains byte-identical.
        verify: [bundleBehaviorExact, sourceLeafJoinComplete, everyLiveInputDigestStillMatchesRuntimeSnapshot, currentOutputsPublishedAtomically, actualWritesEqualAtomicCurrentOutputsForBundle, immutableSnapshotAndLedgersUnchanged, acceptedDecisionsCommitPlanAndLineageUnchanged, noTrackedWrites, warnings == 0, errors == 0]
      focused:
        kind: assure
        owner: local-repair-validator
        authority: { localProcess: bounded, gitMutation: false }
        reads: ['**', .audit/complete-repository-closeout/**]
        action: Run focused proof for the causal repair against a new tree fingerprint.
        verify: [focusedProofPasses, treeFingerprintChangedOrNoChurnProven, warnings == 0, errors == 0]
      recheck:
        kind: assure
        owner: local-repair-rechecker
        authority: { localProcess: inherited-read-only-proof, gitMutation: false }
        reads: ['**', .audit/complete-repository-closeout/**]
        action: Re-run the exact invalidated source-node verification and emit only this dynamic recheck node's standard execution receipt; logical resolution is a separate dependent projection.
        verify: [sourceNodeVerifyContractPasses, dynamicExecutionReceiptIdentityExact, noLogicalReceiptRelabeling, warnings == 0, errors == 0]
      replay-writer:
        kind: write
        owner: inherited-invalidated-writer
        authority: { localWrite: exact-inherited-precommit-outputs, gitMutation: false, productionMutation: false }
        reads: ['{invalidatedNode.exactReads}', .audit/complete-repository-closeout/**]
        writes: ['{invalidatedNode.exactWrites}', '.audit/complete-repository-closeout/local-wave-{M}/{id}.json']
        locks: ['{invalidatedNode.exactLocks}']
        resources: ['{invalidatedNode.exactResources}']
        action: Re-execute the invalidated deterministic pre-commit writer against the current tree with its exact original contract and output leases, then emit only this dynamic replay node's standard execution receipt.
        verify: [originalWriterContractPasses, outputsFreshForCurrentTree, noWritesOutsideInheritedOutputs, dynamicExecutionReceiptIdentityExact, noLogicalReceiptRelabeling, warnings == 0, errors == 0]
      one-way-state-recheck:
        kind: assure
        owner: one-way-state-verifier
        authority: { localRead: declared-current-state-and-historical-receipt, localWrite: ignored-wave-receipt-only, gitMutation: false, recoverableTrash: false, cleanupDeletion: false }
        reads: ['{oneWayPolicy.historicalReceipt}', '{oneWayPolicy.currentStateReads[*]}']
        action: Verify the allowlisted one-way node's immutable historical receipt and declared current-state disposition without inheriting or repeating its original write, move, trash, or cleanup action, then emit only the dynamic state-proof execution receipt.
        verify: [oneWayPredicateSatisfied, historicalReceiptDigestVerified, exactPolicyVerifyPasses, originalMutationNotRepeated, changedDisposition == false, dynamicExecutionReceiptIdentityExact, noOriginalContractReplacement, warnings == 0, errors == 0]
      resolution-projection:
        kind: assure
        owner: logical-resolution-projector
        authority: { localRead: exact-prior-recheck-and-predecessor-proofs, localWrite: exact-wave-local-resolution-artifact, gitMutation: false, productionMutation: false }
        reads: ['{resolutionInputs[*]}']
        writes: ['{resolutionArtifactPath}']
        locks: []
        action: From the standard recheck execution receipt and predecessor projections, emit one cycle-free logical-replacement or historical-state-verified resolution artifact under the safe original-node key; the standard projection receipt separately binds its bytes.
        verify: [pathKeyMatchesOriginalNodeId, resolutionModeExact, priorReceiptDigestVerified, recheckExecutionReceiptDigestVerified, originalNeedsResolvedThroughFinalProjections, originalContractAndVerifyProjectionExactOrHistoricalMode, resolutionArtifactDoesNotDigestProjectionReceipt, sameWaveRetryByteIdempotent, warnings == 0, errors == 0]
      join:
        kind: join
        owner: local-repair-captain
        authority: { localWrite: ignored-audit-only }
        reads: ['.audit/complete-repository-closeout/local-wave-{M}/**']
        locks: [goal-ledgers]
        action: Join every invalidated-node projection and prove exact one-to-one recheck execution, projection execution, resolution artifact, and final terminal-selection accounting before resume.
        verify: [expectedFromDiagnosis, recheckExecutions == expected, projections == expected, resolutionArtifacts == expected, terminalSelections == expected, resolved == expected, skipped == 0, failed == 0]
    waveNodes:
      - id: 'localrepair.{M}.diagnose'
        needs: []
        inputs: [failedNodeReceipt]
        preset: diagnose
        writes:
          - '.audit/complete-repository-closeout/local-wave-{M}/failed-node-receipt.json'
          - '.audit/complete-repository-closeout/local-wave-{M}/localrepair.{M}.diagnose.json'
        onFailure: { stopBarrier: true, invalidOrUnclassifiableEvidence: stop, spawnLocalRepairWave: false, diagnosticImplementationBugRequiresSeparateCompletedEvidence: true, preserveEvidence: true }
      - id: 'localrepair.{M}.apply'
        needs: ['localrepair.{M}.diagnose']
        preset: causal-writer
      - id: 'localrepair.{M}.runtime.snapshot'
        needs: ['localrepair.{M}.apply']
        preset: runtime-snapshot
      - id: 'localrepair.{M}.runtime.census'
        needs: ['localrepair.{M}.runtime.snapshot']
        preset: runtime-producer
        when: artifactBundle in final-sources|published|committed
        action: Independently derive the complete current final-claim census into the wave-local census candidate.
        verify: [bundleConditionExact, independentClaimCensusComplete, outputCount == 58, outputIdsUnique, warnings == 0, errors == 0]
      - id: 'localrepair.{M}.runtime.pairs'
        needs: ['localrepair.{M}.runtime.snapshot']
        preset: runtime-producer
        when: artifactBundle in final-sources|published|committed
        action: Independently discover every current claim/source pair into the wave-local pair candidate without consuming the census candidate.
        verify: [bundleConditionExact, pairDiscoveryIndependent, everyOutputCovered, pairIdsUnique, warnings == 0, errors == 0]
      - id: 'localrepair.{M}.runtime.parity'
        needs: ['localrepair.{M}.runtime.snapshot']
        preset: runtime-producer
        when: artifactBundle in published|committed
        action: Independently verify current catalog SSOT identities and published-path parity without reading goal-local staging.
        verify: [bundleConditionExact, currentCatalogIsSSOT, publishedOutputCount == 58, stagingNotRead, assetAndClaimDigestsMatch, warnings == 0, errors == 0]
      - id: 'localrepair.{M}.runtime.compile'
        needs: ['localrepair.{M}.runtime.census', 'localrepair.{M}.runtime.pairs', 'localrepair.{M}.runtime.parity']
        preset: runtime-compile
        when: artifactBundle in final-sources|published|committed
      - id: 'localrepair.{M}.runtime.source.{pairId}'
        needs: ['localrepair.{M}.runtime.compile']
        preset: runtime-source
        foreach: currentRuntimeFinalClaimSourcePairs
        onFailure: { spawnLocalRepairWave: true, repositoryCauseOnly: true, namedExternalBlockerIfNoAuthoritativeSource: true, candidateEpochUnchanged: true, preserveEvidence: true }
      - id: 'localrepair.{M}.runtime.source.join'
        needs:
          all: ['localrepair.{M}.runtime.compile']
          foreach: 'localrepair.{M}.runtime.source.{currentRuntimeFinalClaimSourcePairs[*].pairId}'
        preset: runtime-source-join
      - id: 'localrepair.{M}.runtime.publish'
        needs: ['localrepair.{M}.runtime.source.join']
        preset: runtime-publish
      - id: 'localrepair.{M}.focused'
        needs: ['localrepair.{M}.runtime.publish']
        preset: focused
      - id: 'localrepair.{M}.recheck.{invalidated.pathKey}'
        needs: ['localrepair.{M}.focused']
        presetFrom: hydration.modeSelector for invalidated.nodeId
        foreach: invalidatedReceipts as invalidated
      - id: 'localrepair.{M}.supersede.{invalidated.pathKey}'
        needs: ['localrepair.{M}.recheck.{invalidated.pathKey}']
        preset: resolution-projection
        foreach: invalidatedReceipts as invalidated
      - id: 'localrepair.{M}.supersede.join'
        needs: ['localrepair.{M}.supersede.{invalidatedReceipts[*].pathKey}']
        preset: join
      - id: 'localrepair.{M}.resume'
        needs: ['localrepair.{M}.supersede.join']
        preset: join
        action: Finalize the receipt-resolution map, complete local-wave execution-closure digest, and repaired tree fingerprint without referencing its own receipt digest; release every causal-path lease and retain the unresolved failed source plus reentrant local-repair-chain lease for ledger publication.
        verify: [failedSourceReceiptResolutionsFinalized, receiptResolutionMapComplete, waveExecutionClosureExact, everyConcreteRuntimePairReceiptIncluded, causalPathLeases == 0, localRepairChainLeaseHeldReentrantly, gitCommitCountUnchanged, remoteObjectsUnchanged]
      - id: 'localrepair.{M}.ledger.append'
        needs: ['localrepair.{M}.resume']
        preset: join
        writes:
          - '.audit/complete-repository-closeout/local-wave-{M}/localrepair.{M}.ledger.append.json'
          - .audit/complete-repository-closeout/successful-local-waves.json
        action: After the resume receipt is final and hashable, atomically upsert this wave, execution-closure digest, and exact receipt-resolution map into the canonically M-sorted successful-local-wave ledger, reject a conflicting duplicate, resolve and release the original source graph, then release the local-repair-chain lease only for the outermost wave while a nested wave preserves its inherited reentrant lease.
        verify: [resumeReceiptDigestVerified, successfulLocalWaveLedgerUpsertedAtomicallyAndCanonicallySorted, conflictingDuplicateWaveRejected, noSelfReferentialDigest, failedSourceNodeResolved, sourceGraphReleased, outermostChainLeaseReleasedAfterSourceGraphOtherwiseHeldReentrantly]
        onFailure: { inspectAtomicUpsertState: true, idempotentSameWaveRetryOnlyAfterInspection: true, stopIfIndeterminate: true, spawnLocalRepairWave: false, sourceAndChainRemainHeldUntilResolved: true, preserveEvidence: true }
    compilerAssertions:
      - all 43 ordinary base-graph pre-commit failure sources use spawnLocalRepairWave
      - every hydrated source.final.check repository failure uses spawnLocalRepairWave while source outages remain named blockers
      - candidate repair diagnose, apply, runtime.rehydrate, focused, writes.freeze, and integrated failures use spawnLocalRepairWave
      - no source is its selected commit boundary or a descendant of that boundary
      - failed source node stays unresolved until localrepair ledger.append
      - localrepair resume finalizes the cycle-free execution closure and exact logical-or-historical receipt-resolution map then releases every causal-path lease while retaining the unresolved failed source and reentrant chain lease through ledger publication
      - localrepair ledger.append resolves and releases the source graph before only the outermost wave releases the persistent chain lease
      - localrepair diagnose failure stops because no child may claim a missing or invalid parent diagnosis digest
      - localrepair ledger.append transport or publication failure inspects atomic state and retries only the same wave idempotently or stops while retaining source and chain ownership
      - exact causal writes recheck executions logical projections and current-runtime evidence nodes hydrate before dispatch
      - localrepair runtime snapshot freezes one coherent bundle under exact locks then census pairs parity compile per-pair source join and publish refresh current evidence before focused proof without changing snapshots ledgers accepted decisions lineage or commit plans
      - invalidated recheck executions and logical projections replay as two exact dependency-ordered induced subgraphs with separate standard execution receipts
      - invalidated deterministic writers regenerate exact current outputs while read-only nodes only recheck
      - each ordinary invalidated node has one safe-keyed logical resolution artifact while each one-way node keeps its historical receipt selected and adds a current-state proof
      - completed allowlisted one-way migration and disposition writers use state-only rechecks and never repeat cutover trash cleanup or deletion authority
      - catalog.cutover may replay only before sources.postcutover.verify completes; later repair reads current catalog SSOT and never goal-local staging
      - a local-wave source resolves only after its complete digest-bound ancestor wave chain recompiles
      - nested wave resume-graph invalidations are disjoint from all ancestor-owned invalidations so canonical wave order also preserves superseding-receipt chronology
      - failed source graphs resolve completed prior waves only through the snapshotted local-wave ledger while repaired graphs use the separately validated current ledger
      - local repair contains no Git ref, commit, push, production, remote-monitor, or live node
      - local repair never changes activeSuccessfulEpoch
      - ledger.append after the finalized resume receipt preserves the source DAG dependency order without a digest cycle
      - local waves may resolve out of numeric order; ledger.append atomically upserts then canonical-sorts while mid-repair validation excludes only the exact active ancestor chain and current wave from the completed set
    forbidden: [git-add-broad, commit, push, branch, worktree, stash, reset, rebase, amend, production-mutation]
  repairEpochTemplate:
    parameter: N
    requires: N > previousCandidateEpoch
    instantiateWhen: a repository-caused exact-HEAD clean-clone, remote, or live failure after commits.construct created candidate epoch 0
    sourceContract:
      sourceMustBeDescendantOf: commits.construct
      priorCandidateCommitRequired: true
      priorLocalGreenReceipt: .audit/complete-repository-closeout/receipts/local.validation.green.json
      priorLocalGreenTreeDigestMustMatchCandidate: true
      eligibleSourceFamilies: [cleanclone, github, vercel, cursor-cloud, live]
    runtimeCompilation:
      epochFlag: --repair-epoch
      failedReceiptFlag: --failed-node-receipt
      diagnosisFlag: --repair-diagnosis
      sourceSnapshotFlag: --repair-source-snapshot
      localWaveLedgerFlag: --local-wave-ledger
      diagnoseCommandTemplate: >-
        node goals/complete-repository-closeout/validate-task-graph.mjs --check --json
        --accepted-output-changes=.audit/complete-repository-closeout/output-decisions.json
        --final-claim-census=.audit/complete-repository-closeout/final-claim-census.json
        --final-source-pairs=.audit/complete-repository-closeout/final-claim-source-pairs.json
        --published-claim-census=.audit/complete-repository-closeout/final-claim-census.json
        --commit-groups=.audit/complete-repository-closeout/commit-plan.json
        --local-wave-ledger=.audit/complete-repository-closeout/successful-local-waves.json
        --repair-epoch={N} --failed-node-receipt={failedReceiptPath}
        --repair-source-snapshot=.audit/complete-repository-closeout/epoch-{N}/source-snapshot/manifest.json
      hydratedCommandTemplate: >-
        node goals/complete-repository-closeout/validate-task-graph.mjs --check --json
        --accepted-output-changes=.audit/complete-repository-closeout/output-decisions.json
        --final-claim-census=.audit/complete-repository-closeout/final-claim-census.json
        --final-source-pairs=.audit/complete-repository-closeout/final-claim-source-pairs.json
        --published-claim-census=.audit/complete-repository-closeout/final-claim-census.json
        --commit-groups=.audit/complete-repository-closeout/commit-plan.json
        --local-wave-ledger=.audit/complete-repository-closeout/successful-local-waves.json
        --repair-epoch={N}
        --failed-node-receipt=.audit/complete-repository-closeout/epoch-{N}/failed-node-receipt.json
        --repair-diagnosis=.audit/complete-repository-closeout/epoch-{N}/repair.{N}.diagnose.json
        --repair-source-snapshot=.audit/complete-repository-closeout/epoch-{N}/source-snapshot/manifest.json
      sourceSnapshotReplay:
        contractRef: localRepairWaveTemplate.runtimeCompilation.sourceSnapshotReplay
        requiredBundle: committed
        manifestPathTemplate: '.audit/complete-repository-closeout/epoch-{N}/source-snapshot/manifest.json'
        currentCliFlagsMustMatchManifestBundleKindExactly: true
        everySnapshotByteDigestVerifiedBeforeSourceResolution: true
        sourceCommitPlanHeadCheckUsesManifestSourceHeadSha: true
        publishedBundleSelectsPublishedPathsForRehydratedClaims: true
        failureTransitionPublishesSnapshotBeforeFailedReceipt: true
        snapshotFilesAndManifestAreSyncedThenAtomicallyRenamed: true
        partialSnapshotFailsClosedAndIsNeverDispatchable: true
      priorCandidateReplay:
        baseCandidate:
          commitPlanFrom: sourceSnapshot artifact dataset commitGroups
          commitsReviewedReceiptPath: .audit/complete-repository-closeout/receipts/commits.reviewed.json
          cleancloneReceiptPath: .audit/complete-repository-closeout/receipts/cleanclone.final.json
          pushReceiptPath: .audit/complete-repository-closeout/receipts/push.initial.json
          repairCandidateShaFrom: sourceSnapshot.sourceHeadSha
          activeEpoch0CandidateShaFrom: current commitGroups final sha
          requireCommitPlanEndsAtCandidateSha: true
          requireDescendsFromFrozenBaselineOrigin: true
          pushReceiptRequiredWhenFirstFailureSourceIsRemoteOrLive: true
        diagnoseRange: candidate epochs 1 through N - 1
        activeSuccessRange: candidate epochs 1 through N
        failedReceiptPathTemplate: '.audit/complete-repository-closeout/epoch-{K}/failed-node-receipt.json'
        diagnosisPathTemplate: '.audit/complete-repository-closeout/epoch-{K}/repair.{K}.diagnose.json'
        commitReceiptPathTemplate: '.audit/complete-repository-closeout/receipts/epoch-{K}/repair.{K}.commit.json'
        pushReceiptPathTemplate: '.audit/complete-repository-closeout/receipts/epoch-{K}/repair.{K}.push.json'
        commitReceiptFields: [nodeId, candidateEpoch, parentCandidateSha, candidateSha, commitPlanDigest, observedAt]
        pushReceiptFields: [nodeId, candidateEpoch, candidateSha, remoteSha, force, observedAt]
        exactContiguousEpochsNoGaps: true
        verifyEveryReceiptAndDiagnosisByteDigest: true
        candidateShaMustMatchNextFailedReceipt: true
        repairCommitMustBeOneConventionalDirectChildOfPriorCandidate: true
        pushReceiptRequiredWhenNextFailureSourceIsRemoteOrLive: true
        pushReceiptForbiddenToBeInventedForPrepushCleancloneFailure: true
        computedLineageDigest: sha256 of canonical ordered epoch and receipt-digest records
      ignoredRoot: .audit/complete-repository-closeout
      failedReceiptSnapshotTemplate: '.audit/complete-repository-closeout/epoch-{N}/failed-node-receipt.json'
      structuralSampleDispatchable: false
      diagnoseDispatchRequiresFailedReceipt: true
      downstreamDispatchRequiresDiagnosis: true
      diagnosis:
        nodeTemplate: 'repair.{N}.diagnose'
        artifactTemplate: '.audit/complete-repository-closeout/epoch-{N}/repair.{N}.diagnose.json'
        requiredFields: [nodeId, candidateEpoch, failedNodeReceiptDigest, causalPaths, observedAt]
        causalPathFields: [path, baselineDigest, reason]
        constraints:
          - causalPaths is nonempty
          - paths are unique exact repo-relative paths
          - paths contain no glob or parent traversal and are not broad roots
          - paths exclude .git and the ignored audit root
          - existing targets and nearest existing ancestors remain inside repository realpath
          - baselineDigest matches each existing target or records absent for a new target
          - ancestor and descendant paths cannot both be leased
      hydration:
        targetNode: 'repair.{N}.apply'
        writesSelector: causalPaths[*].path
        lockTemplate: 'path:{causalPaths[*].realpath}'
        appendCommonAuditWrite: true
        requireWritesEqualCausalPathsPlusAudit: true
    externalInputs:
      failedNodeReceipt:
        cliFlag: --failed-node-receipt
        requiredFields: [nodeId, candidateEpoch, candidateSha, inputTree, localValidationReceiptDigest, sourceSnapshotManifestPath, sourceSnapshotManifestDigest, causeClass, artifactDigest, observedAt]
        immutable: true
        rule: >-
          candidateEpoch == N - 1, causeClass == repository, candidateSha is a
          real commit descended from the locally green tree, nodeId is an
          eligible descendant of commits.construct, and the immutable source
          snapshot is the exact digest-bound committed bundle for candidateSha
    mergeOrder: [commonNode, preset, contractRef, epochNode]
    expandedNodeContract: spec.nodeContract.requiredFields
    contractReference:
      source: spec.nodes
      references:
        cleanclone: cleanclone.final
        github-expected: github.expected
        github-monitor: github.monitor.epoch0
        vercel-monitor: vercel.monitor.epoch0
        vercel-build-logs: vercel.build.logs.epoch0
        cursor-preflight: cursor.cloud.preflight.epoch0
        cursor-cloud: cursor.cloud.epoch0
        remote-green: remote.green.epoch0
        live-browse: live.browse.epoch0
        live-functional: 'live.functional.{route.sourceHash}'
        live-canonical: 'live.route.{output.slug}'
        live-retired: 'live.retired.{route.pathHash}'
        live-case: 'live.case.{case}'
        vercel-runtime: vercel.runtime.window
        live-green: live.green.epoch0
        postlive-reconcile: postlive.reconcile.epoch0
      copiedFields: [kind, owner, authority, reads, locks, resources, action, verify, timeoutSeconds, retry, onFailure]
      exactSemanticParityRequired: true
      epochOwnedFields: [id, needs, reads, writes, locks, resources, produces, receipt, timeoutSeconds, retry, onFailure, terminalBinding]
      rule: >-
        A repair node with contractRef inherits the named base template's complete
        behavioral contract before epoch-owned identity, evidence, and dependency
        fields are applied. It cannot weaken kind, owner, authority, locks,
        resource ceilings, action, verification, timeout, retry, or failure
        semantics; an epoch-specific reads override must be an auditable
        superset of the base evidence classes after epoch-token normalization.
    liveAssuranceContract:
      browse: [deploymentShaExact, status == 200, catalogBrowseThreeKinds, outputCount == 58]
      functional: [deploymentShaExact, redirectMatchesFunctionalContract, finalStatus == 200, noTypedCompatibility]
      canonical: [deploymentShaExact, status == 200, canonicalPathMatches, outputIdentityMatches]
      retired: [deploymentShaExact, status == 404, noRedirectOrAlias]
      case: [deploymentShaExact, manualMatrixExact, privacySentinelAbsent, warnings == 0, errors == 0]
      runtime: [deploymentShaExact, runtimeWarnings == 0, runtimeErrors == 0]
    commonNode:
      phase: repair
      owner: repair-epoch-owner
      authority: { localRead: true }
      reads: [.audit/complete-repository-closeout/**]
      writes: ['.audit/complete-repository-closeout/epoch-{N}/{id}.json']
      locks: []
      action: Execute the typed repair-epoch role for the exact failed receipt and candidate epoch.
      produces: ['{id}-complete']
      verify: [candidateEpoch == N, decisionBundleDigestMatches, receiptComplete]
      receipt: '.audit/complete-repository-closeout/receipts/epoch-{N}/{id}.json'
      timeoutSeconds: 7200
      retry: { maxAttempts: 1, transientOnly: true, preserveAttempts: true }
      onFailure: { spawnLocalRepairWave: true, candidateEpochUnchanged: true, preserveEvidence: true }
    presets:
      diagnose:
        kind: read
        owner: repair-diagnostician
        action: Bind the immutable failed receipt to one repository-controlled cause, affected descendants, and one exclusive writer lease.
        verify: [failedReceiptDigestVerified, oneCausalOwner, affectedDescendantsComplete]
      causal-writer:
        kind: write
        owner: causal-repair-writer
        authority: { localWrite: exact-causal-paths }
        reads: [.audit/complete-repository-closeout/**, '{causalPaths[*].path}']
        writes: ['.audit/complete-repository-closeout/epoch-{N}/{id}.json', '{causalPaths[*].path}']
        locks: ['path:{causalPaths[*].realpath}']
        dynamicWrites:
          fromDiagnosis: 'repair.{N}.diagnose'
          selector: causalPaths[*].path
          hydrationRequired: true
        action: Apply the smallest causal repair and regression coverage only to the exact diagnosis-bound path set.
        verify: [causalPathsNonemptyAndDigestBound, noWritesOutsideHydratedLeases, regressionAddedWhereApplicable]
      runtime-rehydrate:
        kind: write
        owner: repair-runtime-artifact-owner
        authority: { localWrite: ignored-current-runtime-artifacts, networkRead: final-source-urls, gitMutation: false, productionMutation: false }
        reads: ['**', .audit/complete-repository-closeout/output-decisions.json, '.audit/complete-repository-closeout/epoch-{N}/source-snapshot/**']
        writes:
          - .audit/complete-repository-closeout/final-claim-census.json
          - .audit/complete-repository-closeout/final-claim-source-pairs.json
          - .audit/complete-repository-closeout/source-postcutover-parity.json
          - .audit/complete-repository-closeout/sources/final/**
          - '.audit/complete-repository-closeout/epoch-{N}/{id}.json'
        locks: [source-manifest, goal-ledgers]
        action: Recompute the current claim census, source pairs, published-path parity, and exact source evidence after the causal edit; do not alter accepted decisions or tracked source metadata, and fail into a local repair wave if tracked evidence changes are required.
        verify: [acceptedOutputDecisionsUnchanged, currentCensusAndPairsFresh, publishedParityFresh, everyFinalClaimSourcePairRechecked, trackedSourceChangeRequired == false, warnings == 0, errors == 0]
        onFailure: { spawnLocalRepairWave: true, candidateEpochUnchanged: true, preserveEvidence: true }
      local-assure:
        kind: assure
        owner: validation-captain
        authority: { localProcess: bounded }
        reads: ['**', .audit/complete-repository-closeout/**]
        action: Run the named focused or integrated validation contract with exact tools and ignored receipts.
        verify: [allCommandsPass, warnings == 0, errors == 0]
        onFailure: { spawnLocalRepairWave: true, candidateEpochUnchanged: true, preserveEvidence: true }
      barrier:
        kind: barrier
        owner: coordinator
        authority: { localRead: true }
        locks: [goal-ledgers]
        action: Join the complete epoch-local predecessor set and release every lease.
        verify: [dispatchedMinusResolvedMinusSkipped == 0, failed == 0]
        onFailure: { spawnLocalRepairWave: true, candidateEpochUnchanged: true, preserveEvidence: true }
      drift-gate:
        kind: assure
        owner: git-owner
        authority: { networkRead: origin-fetch }
        reads: [.git]
        writes: [.git/FETCH_HEAD, '.audit/complete-repository-closeout/epoch-{N}/{id}.json']
        locks: [git-index]
        action: Fetch and require unchanged origin/main; stop for user direction rather than merge or rebase.
        verify: [branch == main, originMain == expectedParent]
        onFailure: { stopForUserDirection: true, preserveEvidence: true }
      commit:
        kind: write
        owner: git-owner
        authority: { gitCommit: conventional-forward-fix }
        reads: ['**', .git]
        writes: [.git/index, .git/objects/**, .git/refs/heads/main, .audit/complete-repository-closeout/commit-plan.json, '.audit/complete-repository-closeout/epoch-{N}/{id}.json']
        locks: [git-index]
        action: Stage named causal paths, review the index, create one new conventional forward-fix commit without history rewrite, and append its exact record to the ignored commit plan.
        verify: [newCommitCreated, parentExact, stagedPathsExact, commitPlanAppendedAndLinear]
        onFailure: { stopBarrier: true, inspectBeforeIdempotentRetry: true, candidateEpochUnchanged: true, amendResetRebaseForbidden: true, preserveEvidence: true }
      push:
        kind: write
        owner: git-owner
        authority: { gitPush: origin-main-non-force }
        reads: [.git]
        writes: ['remote:origin/main', '.audit/complete-repository-closeout/epoch-{N}/{id}.json']
        locks: [origin-main-push]
        action: Push the new candidate non-force after the second drift gate; stop on protection rejection.
        verify: [originMain == candidateSha, force == false]
        onFailure: { retryTransientSameCandidate: true, stopForUserDirectionIfProtection: true, candidateEpochUnchanged: true, preserveEvidence: true }
      external-monitor:
        kind: external-monitor
        owner: remote-monitor
        authority: { networkRead: exact-sha-state, productionMutation: false }
        action: Run the named complete exact-SHA provider proof and retain every attempt.
        verify: [providerObjectsReferenceCandidateSha, paginationComplete, warnings == 0, errors == 0]
      foreach-assure:
        kind: assure
        owner: live-assurance-worker
        authority: { networkRead: production-http, productionMutation: false }
        action: Run one exact live dataset item and emit an individually keyed receipt.
        verify: [candidateShaExact, expectedBehavior]
      join:
        kind: join
        owner: epoch-join-captain
        authority: { localWrite: ignored-audit-only }
        locks: [goal-ledgers]
        action: Join the exact epoch-local expansion with complete expected/dispatched/resolved/skipped/failed accounting.
        verify: [expectedCountExact, dispatched == expected, resolved + skipped == expected, failed == 0]
        onFailure: { stopBarrier: true, candidateEpochUnchanged: true, preserveEvidence: true }
    epochNodes:
      - id: 'repair.{N}.diagnose'
        needs: []
        inputs: [failedNodeReceipt]
        preset: diagnose
        writes:
          - '.audit/complete-repository-closeout/epoch-{N}/failed-node-receipt.json'
          - '.audit/complete-repository-closeout/epoch-{N}/repair.{N}.diagnose.json'
        onFailure: { stopBarrier: true, invalidOrUnclassifiableEvidence: stop, spawnLocalRepairWave: false, diagnosticImplementationBugRequiresSeparateCompletedEvidence: true, preserveEvidence: true }
      - { id: 'repair.{N}.apply', needs: ['repair.{N}.diagnose'], preset: causal-writer }
      - { id: 'repair.{N}.runtime.rehydrate', needs: ['repair.{N}.apply'], preset: runtime-rehydrate }
      - { id: 'repair.{N}.focused', needs: ['repair.{N}.runtime.rehydrate'], preset: local-assure }
      - { id: 'repair.{N}.writes.freeze', needs: ['repair.{N}.focused'], preset: barrier }
      - { id: 'repair.{N}.integrated', needs: ['repair.{N}.writes.freeze'], preset: local-assure }
      - { id: 'repair.{N}.origin.precommit', needs: ['repair.{N}.integrated'], preset: drift-gate }
      - { id: 'repair.{N}.commit', needs: ['repair.{N}.origin.precommit'], preset: commit }
      - { id: 'repair.{N}.cleanclone', needs: ['repair.{N}.commit'], preset: local-assure, contractRef: cleanclone, writes: ['temporary-clean-clone:epoch-{N}', '.audit/complete-repository-closeout/epoch-{N}/repair.{N}.cleanclone.json'] }
      - { id: 'github.expected.epoch{N}', needs: ['repair.{N}.cleanclone'], preset: external-monitor, contractRef: github-expected }
      - { id: 'repair.{N}.origin.prepush', needs: ['repair.{N}.cleanclone', 'github.expected.epoch{N}'], preset: drift-gate }
      - { id: 'repair.{N}.push', needs: ['repair.{N}.origin.prepush'], preset: push }
      - { id: 'github.monitor.epoch{N}', needs: ['repair.{N}.push', 'github.expected.epoch{N}'], preset: external-monitor, contractRef: github-monitor }
      - { id: 'vercel.monitor.epoch{N}', needs: ['repair.{N}.push'], preset: external-monitor, contractRef: vercel-monitor }
      - { id: 'vercel.build.logs.epoch{N}', needs: ['vercel.monitor.epoch{N}'], preset: external-monitor, contractRef: vercel-build-logs }
      - { id: 'cursor.preflight.epoch{N}', needs: ['repair.{N}.push'], preset: external-monitor, contractRef: cursor-preflight }
      - { id: 'cursor.cloud.epoch{N}', needs: ['cursor.preflight.epoch{N}'], preset: external-monitor, contractRef: cursor-cloud }
      - { id: 'remote.green.epoch{N}', needs: ['github.monitor.epoch{N}', 'vercel.build.logs.epoch{N}', 'cursor.cloud.epoch{N}'], preset: barrier, contractRef: remote-green, reads: ['.audit/complete-repository-closeout/epoch-{N}/**'] }
      - { id: 'live.browse.epoch{N}', needs: ['remote.green.epoch{N}'], preset: foreach-assure, contractRef: live-browse }
      - { id: 'live.functional.epoch{N}.{route.sourceHash}', needs: ['remote.green.epoch{N}'], preset: foreach-assure, foreach: functionalRoutes, contractRef: live-functional }
      - { id: 'live.functional.join.epoch{N}', needs: ['live.functional.epoch{N}.{functionalRoutes[*].sourceHash}'], preset: join, expected: 2 }
      - { id: 'live.route.epoch{N}.{output.slug}', needs: ['remote.green.epoch{N}'], preset: foreach-assure, foreach: outputs, contractRef: live-canonical }
      - { id: 'live.route.join.epoch{N}', needs: ['live.route.epoch{N}.{outputs[*].slug}'], preset: join, expected: 58 }
      - { id: 'live.retired.epoch{N}.{route.pathHash}', needs: ['remote.green.epoch{N}'], preset: foreach-assure, foreach: retiredTypedRoutes, contractRef: live-retired }
      - { id: 'live.retired.join.epoch{N}', needs: ['live.retired.epoch{N}.{retiredTypedRoutes[*].pathHash}'], preset: join, expected: 93 }
      - { id: 'live.case.epoch{N}.{case}', needs: ['remote.green.epoch{N}'], preset: foreach-assure, foreach: liveCases, contractRef: live-case }
      - { id: 'live.case.join.epoch{N}', needs: ['live.case.epoch{N}.{liveCases[*]}'], preset: join, expected: 8 }
      - { id: 'vercel.runtime.epoch{N}', needs: ['live.browse.epoch{N}', 'live.functional.join.epoch{N}', 'live.route.join.epoch{N}', 'live.retired.join.epoch{N}', 'live.case.join.epoch{N}'], preset: external-monitor, contractRef: vercel-runtime }
      - { id: 'live.green.epoch{N}', needs: ['vercel.runtime.epoch{N}'], preset: barrier, contractRef: live-green, reads: ['.audit/complete-repository-closeout/epoch-{N}/**'] }
      - id: 'postlive.reconcile.epoch{N}'
        needs: ['live.green.epoch{N}']
        preset: local-assure
        contractRef: postlive-reconcile
        reads: ['**', .audit/complete-repository-closeout/**, 'remote:github', 'remote:vercel', 'remote:cursor-cloud']
        writes:
          - '.audit/complete-repository-closeout/epoch-{N}/postlive.reconcile.epoch{N}.json'
          - .audit/complete-repository-closeout/active-successful-epoch.json
        locks: [goal-ledgers]
        terminalBinding:
          activeSuccessfulEpoch: '{N}'
          previousCandidateEpoch: '{previousCandidateEpoch}'
          writeIgnoredReceipt: .audit/complete-repository-closeout/active-successful-epoch.json
          afterReceiptDigest: true
          includeArtifactDigests:
            failedNodeReceiptDigest: '.audit/complete-repository-closeout/epoch-{N}/failed-node-receipt.json'
            repairDiagnosisDigest: '.audit/complete-repository-closeout/epoch-{N}/repair.{N}.diagnose.json'
          includeComputedDigests: [terminalDependencyClosureDigest, compiledGraphDigest, runtimeBundleDigest, candidateLineageDigest, localWaveLedgerDigest]
          trackedMutation: forbidden
    rule: >-
      Only repository-caused exact-HEAD clean-clone, remote, or live failures
      after commits.construct create candidate epoch N+1. The epoch has one
      causal repair writer, focused tests, writes.freeze, integrated validation,
      a new conventional forward-fix commit, exact-HEAD clean clone, non-force
      push, and new remote/live nodes. Diagnose, apply, runtime rehydrate,
      focused, integrated, and pre-commit barrier failures open a uniquely receipted local repair wave
      without advancing N. Commit failure stops for inspected idempotent
      same-candidate retry;
      push failure receives transient same-candidate retry or stops on protection.
      No edge points to an earlier epoch; failed attempts remain evidence.
      Infrastructure-only reruns require independent evidence and never erase
      the original attempt.
    compilerAssertions:
      - every epoch-local dependency resolves after substituting N
      - every preset merge produces every required regular node field
      - no epoch N node depends on a future epoch
      - the immutable failed receipt is an external input, not an unresolved node edge
      - every remote and live expansion rejoins before postlive reconciliation
      - candidate SHA increases by a new commit before every additional push
      - diagnose, apply, runtime rehydrate, focused, integrated, and pre-commit barrier failures route through a local repair wave and do not advance N
      - commit and push failures do not advance N
      - only repository-caused clean-clone, remote, or live contract failures may advance N
      - github expected contexts are recomputed for every new candidate SHA
      - goal.done resolves through postlive.reconcile.epoch activeSuccessfulEpoch
      - failed candidate graphs resolve completed prior local waves through the snapshotted ledger while the active repair graph uses the separately validated current ledger
    forbidden: [amend, reset, rebase, force-push, production-setting-mutation]
