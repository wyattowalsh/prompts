      writes: ['.audit/complete-repository-closeout/local-wave-{M}/{id}.json']
      locks: []
      produces: ['{id}-complete']
      receipt: '.audit/complete-repository-closeout/receipts/local-wave-{M}/{id}.json'
      timeoutSeconds: 7200
      retry: { maxAttempts: 1, transientOnly: true, preserveAttempts: true }
