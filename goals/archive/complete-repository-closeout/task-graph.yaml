        --local-wave-ledger=.audit/complete-repository-closeout/successful-local-waves.json
        --local-repair-wave={M}
        --local-failed-node-receipt=.audit/complete-repository-closeout/local-wave-{M}/failed-node-receipt.json
        --local-repair-diagnosis=.audit/complete-repository-closeout/local-wave-{M}/localrepair.{M}.diagnose.json
        --local-source-snapshot=.audit/complete-repository-closeout/local-wave-{M}/source-snapshot/manifest.json
      sourceSnapshotReplay:
        manifestPathTemplate: '.audit/complete-repository-closeout/local-wave-{M}/source-snapshot/manifest.json'
        manifestRequiredFields: [bundle, sourceGraph, resumeGraph, commitBoundaryId, candidateEpoch, sourceTree, sourceHeadSha, artifacts, assets, hydrationBarriers, localWaveLedger, createdAt]
        artifactField: artifacts
        artifactBindingFields: [dataset, originalPath, snapshotPath, digest]
        assetField: assets
        assetBindingFields: [originalPath, snapshotPath, digest]
        barrierField: hydrationBarriers
        barrierBindingFields: [nodeId, originalReceiptPath, snapshotPath, digest]
        localWaveLedgerField: localWaveLedger
        localWaveLedgerBindingFields: [originalPath, snapshotPath, digest]
        localWaveLedgerOriginalPath: .audit/complete-repository-closeout/successful-local-waves.json
        snapshotRootTemplate: '.audit/complete-repository-closeout/local-wave-{M}/source-snapshot'
        allowedOrderedBundles:
          none: []
          accepted:
            - { dataset: acceptedOutputChanges, flag: --accepted-output-changes, originalPath: .audit/complete-repository-closeout/output-decisions.json }
          final-sources:
            - { dataset: acceptedOutputChanges, flag: --accepted-output-changes, originalPath: .audit/complete-repository-closeout/output-decisions.json }
            - { dataset: finalClaimCensus, flag: --final-claim-census, originalPath: .audit/complete-repository-closeout/final-claim-census.json }
            - { dataset: finalClaimSourcePairs, flag: --final-source-pairs, originalPath: .audit/complete-repository-closeout/final-claim-source-pairs.json }
          published:
