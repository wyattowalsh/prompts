# Archival execute-time provenance. Production loaders must not read this file.
# Catalog YAML is not edited in this pass.
version: 1
kind: flatten-prompt-catalog-merge-ledger
status: accepted
purpose: >-
  Execute-time archival provenance for the 0.1.0 flatten. Production loaders, generators, and routes
  must not read this file or retired source ids.
snapshot:
  recipes: 48
  patterns: 43
  source_files: 91
result:
  prompts: 83
  merged_groups: 7
  merged_source_files: 15
  singletons: 76
rules:
  merge: same job in different shapes AND shared lane AND shared title stem
  facet: job or method only; merged paste-first prompts are job
  modes: 1-4 named modes per prompt; exactly one default; modes own the paste path
  playbook: no Playbook kind, noun, or composer; closeout 23 clusters are candidates only
  slugs: >-
    mint new canonical slugs for merges; rename type-suffix leftovers (*-checklist, python-*, split
    *-prompting); keep famous slugs code-review and tree-of-thoughts; never use reserved names
reserved_slugs:
  - catalog
  - explore
  - sources
  - recipes
  - patterns
  - research
  - github
famous_slugs_kept:
  - code-review
  - tree-of-thoughts
required_merges:
  - canonical_slug: plan-then-solve
    sources:
      - catalog/recipes/plan-and-solve.yaml
      - catalog/patterns/plan-and-solve-prompting.yaml
  - canonical_slug: usability-review
    sources:
      - catalog/recipes/ux-review.yaml
      - catalog/patterns/ux-review-checklist.yaml
  - canonical_slug: unit-test-authoring
