slug: structured-outputs-json-schema
title: Structured Outputs / JSON Schema
lane: data
blurb: >-
  use provider-enforced structured output, JSON Schema, or tool schemas so downstream
  code can parse reliably.
order: 15
badge:
  logo: ri:RiFileCodeLine
  color: "EAB308"
  chip_label: JSON Schema
evidence: Strong; official docs.
safety:
  - Do not fabricate JSON on refusal; return the provider refusal state.
  - Schemas constrain shape, not truth; still separate untrusted input and verify claims before acting.
  - Downstream code must validate the parsed object before use.
caveat: |
  schemas constrain shape, not truth; still separate untrusted input and verify claims before acting.
definition: |
  use provider-enforced structured output, JSON Schema, or tool schemas so downstream code can parse reliably.
avoid_when: exploratory writing or open-ended analysis is more useful than a rigid contract.
model_api_controls: |
  Prefer host-enforced structured output APIs over "reply in JSON" prose alone: OpenAI Structured Outputs,
  Google Gemini structured outputs (JSON Schema), Azure OpenAI structured outputs, Anthropic structured outputs /
  tool-constrained JSON where available, and xAI structured outputs. Use the provider's supported schema subset;
  validate parsed objects in application code before side effects.
cost_latency: low to moderate; schema compilation or strict mode can add overhead.
failure_modes: |
  unsupported schema features, refusal handling gaps, assuming all providers use the same JSON Schema subset,
  treating schema-valid JSON as factually correct, missing downstream type validation.
eval_required: true
related:
  - json-extractor
sources:
  - title: OpenAI structured outputs
    url: https://developers.openai.com/api/docs/guides/structured-outputs
  - title: Anthropic Structured Outputs
    url: https://platform.claude.com/docs/en/build-with-claude/structured-outputs
  - title: Google Gemini structured output
    url: https://ai.google.dev/gemini-api/docs/structured-output
  - title: xAI structured outputs
    url: https://docs.x.ai/developers/model-capabilities/text/structured-outputs
  - title: Azure OpenAI structured outputs
    url: https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/structured-outputs
modes:
  - id: template
    label: Method template
    default: true
    when_to_use: APIs, extraction, routing, scoring, classification, and any workflow with a parser.
    placeholders:
      - name: task
        required: true
        example: Extract renewal fields into the schema
        notes: Extraction or structuring task
      - name: trusted_context
        required: true
        example: Use ISO dates; omit unsupported fields
        notes: Authoritative rules
      - name: input
        required: true
        example: "Name: Ana Rivera; Renewal: 2026-07-01; Plan: Team"
        notes: Untrusted source text
      - name: schema_intent
        required: true
        example: object with name, renewal_date, and plan
        notes: JSON Schema or provider structured-output contract
    prompt: |
      Task:
      {task}

      Trusted context:
      <context>
      {trusted_context}
      </context>

      Untrusted input:
      <input>
      {input}
      </input>

      Schema intent:
      {schema_intent}

      Validation requirements:
      - All required fields must be present.
      - Unknown fields are not allowed unless the schema permits them.
      - If the model refuses or cannot comply, return the provider refusal state and do not fabricate JSON.
      - Downstream code must validate the parsed object before use.
