slug: meta-prompting
title: Meta-Prompting
lane: agents
blurb: ask a model to draft or improve prompt candidates for a target task.
order: 60
badge:
  logo: ri:RiChatQuoteLine
  color: "0EA5E9"
  chip_label: Meta-Prompt
evidence: Moderate. Survey plus prompt optimization research.
safety:
  - Do not select generated prompts by plausibility alone.
  - Meta-prompting is ideation; optimization requires measurement.
caveat: meta-prompting is ideation; optimization requires measurement.
definition: ask a model to draft or improve prompt candidates for a target task.
avoid_when: generated prompts will be trusted without held-out tests.
model_api_controls: >-
  pair with an eval set; do not select by plausibility alone; survey-tier PE
  literature (e.g. Prompt Report arXiv:2406.06608) is ideation context, not a
  license to ship unmeasured prompts.
cost_latency: moderate.
failure_modes: longer prompts with no measurable gain, overfitting to visible examples.
eval_required: true
related:
  - prompt-optimizer
sources:
  - title: The Prompt Report
    url: https://arxiv.org/abs/2406.06608
  - title: Large Language Models are Human-Level Prompt Engineers
    url: https://arxiv.org/abs/2211.01910
  - title: OpenAI evaluation best practices
    url: https://developers.openai.com/api/docs/guides/evaluation-best-practices
modes:
  - id: template
    label: Method template
    default: true
    when_to_use: Exploring prompt variants, rubrics, and failure hypotheses before eval.
    placeholders:
      - name: task
        required: true
        example: Write a prompt that classifies support tickets
        notes: Target task
      - name: audience
        required: true
        example: Tier-1 support agents
        notes: Audience
      - name: failures
        required: true
        example: Invented labels; no abstain path
        notes: Known failure modes
      - name: examples
        required: true
        example: Two labeled tickets, billing vs outage
        notes: Evaluation examples
    prompt: |
      Design three prompt candidates for this task.

      Task:
      <task>
      {task}
      </task>

      Audience: {audience}
      Known failure modes: {failures}
      Evaluation examples:
      <examples>
      {examples}
      </examples>

      For each candidate, return:
      - prompt
      - expected strength
      - likely failure mode
      - eval case that would disprove it
