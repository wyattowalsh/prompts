slug: intentional-analysis
title: Intentional Analysis
lane: reasoning
blurb: explicitly identify the user's likely goal and deliverable before solving.
order: 120
badge:
  logo: ri:RiSearchEyeLine
  color: 8B5CF6
  chip_label: Intent
evidence: Emerging; primary research.
safety:
  - Intent analysis must trace to the request, not speculation.
  - Do not invent hidden motives.
caveat: intent analysis must trace to the request, not speculation.
definition: explicitly identify the user's likely goal and deliverable before solving.
avoid_when: intent is explicit or analysis would invent hidden motives.
model_api_controls: none by default.
cost_latency: low to moderate.
failure_modes: over-interpreting, inventing hidden intent, unnecessary delay.
eval_required: true
sources:
  - title: Improving Language Models with Intentional Analysis
    url: https://arxiv.org/abs/2502.04689
modes:
  - id: template
    label: Method template
    default: true
    when_to_use: >-
      ambiguous requests, instruction-following failures, and tasks where surface
      wording may not match the real need.
    placeholders:
      - name: request
        required: true
        example: Can you look at this and tell me what to do next?
        notes: Ambiguous user request
    prompt: |
      Request:
      <input>
      {request}
      </input>

      Determine:
      - explicit request
      - likely deliverable
      - ambiguities
      - least-risky interpretation

      Then complete the task. If ambiguity is high-impact, ask a concise question.
