slug: rag-citation-grounded-answering
title: RAG / Citation-Grounded Answering
lane: agents
blurb: >-
  answer from retrieved or provided sources with source IDs, citation checks,
  and missing-evidence behavior.
order: 100
badge:
  logo: ri:RiBookmark3Line
  color: "2DD4BF"
  chip_label: Grounded RAG
evidence: >-
  Strong for the retrieval-grounded architecture, Moderate for any exact prompt.
  Primary paper, RAG evaluation survey, plus official grounding and citation
  docs.
safety:
  - Citations must be checked against source text; model-generated citations can be wrong.
  - Use only the sources provided unless reliable general knowledge is explicitly allowed.
caveat: citations must be checked against source text; model-generated citations can be wrong.
definition: >-
  answer from retrieved or provided sources with source IDs, citation checks,
  and missing-evidence behavior.
avoid_when: retrieval quality is unknown and no review path exists.
model_api_controls: >-
  retrieval query, source ranking, grounding metadata, provider citation
  controls, citation validator, context budget, faithfulness/attribution evals
  (pair with eval harness for production RAG).
cost_latency: moderate to high.
failure_modes: >-
  retrieval miss, source poisoning, citation mismatch, unverified generated
  citations, lost middle effects, free-form "cite sources" without
  retrieval/attribution contracts.
eval_required: true
related:
  - rag-answer-contract
sources:
  - title: Retrieval-Augmented Generation
    url: https://arxiv.org/abs/2005.11401
  - title: Lost in the Middle
    url: https://arxiv.org/abs/2307.03172
  - title: Retrieval Augmented Generation Evaluation
    url: https://arxiv.org/abs/2504.14891
  - title: OpenAI citation formatting
    url: https://developers.openai.com/api/docs/guides/citation-formatting
  - title: Anthropic citations
    url: https://platform.claude.com/docs/en/build-with-claude/citations
  - title: Google Gemini grounding with Search
    url: https://ai.google.dev/gemini-api/docs/google-search
  - title: NIST AI RMF Generative AI Profile
    url: https://www.nist.gov/publications/artificial-intelligence-risk-management-framework-generative-artificial-intelligence
  - title: OpenAI evaluation best practices
    url: https://developers.openai.com/api/docs/guides/evaluation-best-practices
  - title: Gemini prompting strategies
    url: https://ai.google.dev/gemini-api/docs/prompting-strategies
modes:
  - id: template
    label: Method template
    default: true
    when_to_use: >-
      Current facts, private documents, research synthesis, support answers, and
      compliance-sensitive summaries.
    placeholders:
      - name: question
        required: true
        example: Which support plan includes priority onboarding?
        notes: Question
      - name: sources
        required: true
        example: see_preview_below
        notes: "source_id: excerpt or document chunk"
        preview: |
          [src_team_plan] Team plan includes standard onboarding (rev 2026-03-01).
          [src_ent_plan] Enterprise plan includes priority onboarding (rev 2026-02-15).
    prompt: |
      Question:
      {question}

      Sources:
      <sources>
      {sources}
      </sources>

      Rules:
      - Use only the sources above unless reliable general knowledge is explicitly allowed.
      - Cite source IDs for each factual claim.
      - Separate source facts from inference.
      - Preserve disagreements and uncertainty.
      - If evidence is missing, say what is missing.

      Output:
      - answer
      - citations
      - unresolved gaps
