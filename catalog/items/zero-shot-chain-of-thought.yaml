slug: zero-shot-chain-of-thought
title: Zero-Shot Chain-of-Thought
lane: reasoning
blurb: elicit intermediate reasoning for a reasoning task without examples.
order: 110
badge:
  logo: ri:RiLightbulbLine
  color: 8B5CF6
  chip_label: CoT
evidence: Moderate; primary research plus caveat studies.
safety:
  - >-
    Prefer provider reasoning/thinking controls when available instead of asking for
    long public chain-of-thought.
  - Classic visible chain-of-thought evidence is task- and model-generation-sensitive.
caveat: >-
  Classic visible CoT evidence is task- and model-generation-sensitive; for current
  models, treat reasoning as an API control surface first (see OpenAI reasoning,
  Anthropic extended thinking, Gemini thinking docs).
definition: elicit intermediate reasoning for a reasoning task without examples.
avoid_when: |-
  modern reasoning controls, safety-sensitive tasks, or final-answer schemas are better.
   Prefer private reasoning controls over paste-template "think step by step" for production tool/agent jobs.
model_api_controls: >-
  Prefer provider reasoning/thinking controls when available (OpenAI reasoning
  effort/summary, Anthropic extended thinking budget, Gemini thinking config) instead of
  asking for long public CoT. Use visible step lists only when the deliverable itself is
  a teachable procedure and evals allow it.
cost_latency: moderate to high.
failure_modes: >-
  unfaithful explanations, higher harmfulness in sensitive settings, extra tokens with
  marginal gain, conflating classic CoT prompting with modern provider reasoning APIs.
eval_required: true
related:
  - chain-of-draft
sources:
  - title: Large Language Models are Zero-Shot Reasoners
    url: https://arxiv.org/abs/2205.11916
  - title: On Second Thought, Let's Not Think Step by Step
    url: https://arxiv.org/abs/2212.08061
  - title: Language Models Don't Always Say What They Think
    url: https://arxiv.org/abs/2305.04388
  - title: Prompting Science Report 2
    url: https://arxiv.org/abs/2506.07142
  - title: OpenAI reasoning guide
    url: https://developers.openai.com/api/docs/guides/reasoning
  - title: Anthropic extended thinking
    url: https://platform.claude.com/docs/en/build-with-claude/extended-thinking
  - title: Gemini thinking
    url: https://ai.google.dev/gemini-api/docs/thinking
modes:
  - id: template
    label: Method template
    default: true
    when_to_use: >-
      older or non-reasoning models on arithmetic, symbolic, or logic tasks where
      concise rationale helps debugging.
    placeholders:
      - name: problem
        required: true
        example: Train A 9:00 at 60mph; Train B 10:00 at 90mph — when meet?
        notes: Problem to solve
    prompt: |
      Solve the problem using private reasoning.

      Return:
      - answer
      - concise rationale
      - checks performed

      Problem:
      <input>
      {problem}
      </input>
