slug: evaluation-flywheel
title: Evaluation Flywheel
facet: method
lane: agents
blurb: >-
  improve prompts through fixed eval cases, measured failures, controlled
  changes, and regression checks.
order: 60
badge:
  logo: ri:RiRepeat2Line
  color: "0369A1"
  chip_label: Flywheel
evidence: >-
  Strong. Official docs plus engineering practice. As verified on 2026-08-16,
  the hosted Evals dashboard/API is shutting down (read-only 2026-10-31, gone
  2026-11-30) — do not cite it as a current official eval host.
safety:
  - Accept only if quality improves without safety, refusal, parser, latency, or cost regressions.
  - Eval quality depends on representative cases and stable scoring.
caveat: eval quality depends on representative cases and stable scoring.
definition: >-
  improve prompts through fixed eval cases, measured failures, controlled
  changes, and regression checks.
avoid_when: a one-off exploratory prompt does not need maintenance.
model_api_controls: >-
  custom eval harness, agent evals, trace grading, scheduled evals, monitoring,
  datasets/graders; keep OpenAI evaluation best practices as the method. As
  verified on 2026-08-16, the hosted Evals dashboard/API is shutting down
  (read-only 2026-10-31, gone 2026-11-30) per deprecations — do not cite it as a
  current official eval host.
cost_latency: upfront cost; lower regression risk later.
failure_modes: >-
  unrepresentative tests, optimizing the wrong metric, silent
  model/retrieval/tool drift.
eval_required: true
related:
  - eval-driven-prompt-optimization
sources:
  - title: OpenAI evaluation best practices
    url: https://developers.openai.com/api/docs/guides/evaluation-best-practices
  - title: OpenAI agent evals
    url: https://developers.openai.com/api/docs/guides/agent-evals
  - title: OpenAI trace grading
    url: https://developers.openai.com/api/docs/guides/trace-grading
  - title: OpenAI Cookbook eval flywheel
    url: https://github.com/openai/openai-cookbook/blob/main/examples/evaluation/Building_resilient_prompts_using_an_evaluation_flywheel.md
  - title: OpenAI Evals platform deprecations
    url: https://developers.openai.com/api/docs/deprecations
  - title: Microsoft Foundry evaluations
    url: https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluate-generative-ai-app
  - title: Microsoft Foundry observability
    url: https://learn.microsoft.com/en-us/azure/foundry/concepts/observability
  - title: NIST AI RMF
    url: https://www.nist.gov/itl/ai-risk-management-framework
modes:
  - id: template
    label: Method template
    default: true
    when_to_use: >-
      Production prompts, repeated workflows, high-stakes outputs, and shared
      prompt libraries; keep the eval-flywheel method even when a hosted
      dashboard is shutting down.
    placeholders:
      - name: prompt_version
        required: true
        example: support-classifier-v3
        notes: Prompt version id
      - name: model_snapshot
        required: true
        example: provider-model-2026-08-01
        notes: Model/provider snapshot
      - name: settings
        required: true
        example: temperature 0; schema on; no tools
        notes: Reasoning effort, verbosity, temperature, tools, schema
      - name: retrieval_corpus_or_fixture
        required: true
        example: "fixture: support-tickets-v4.jsonl"
        notes: Context source
      - name: eval_cases
        required: true
        example: see_preview_below
        notes: Input, expected behavior, and safety notes
        preview: |
          input: missing price in retrieved docs
          expected_behavior: abstain
          safety_notes: do not invent a price
    prompt: |
      Prompt version: {prompt_version}
      Model/provider: {model_snapshot}
      Settings: {settings}
      Context source: {retrieval_corpus_or_fixture}

      Eval cases:
      <cases>
      {eval_cases}
      </cases>

      Process:
      1. Run baseline.
      2. Record failures.
      3. Change one factor.
      4. Rerun the same cases.
      5. Accept only if quality improves without safety, refusal, parser, latency, or cost regressions.
