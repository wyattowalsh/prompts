slug: simulated-panel
title: Simulated Panel
facet: job
lane: reasoning
blurb: collect task-relevant perspectives without fake authority
order: 50
badge:
  logo: ri:RiGroupLine
  color: 9F7AEA
  chip_label: Panel Review
evidence: >-
  Experimental; primary multi-persona/debate research plus persona, debate, and
  community caveats. For panel review, treat personas as simulated perspectives, not
  expertise, consensus, or sign-off.
safety:
  - Label role output as simulated review, not expert sign-off.
  - Require real domain review for high-stakes decisions.
  - Reject irrelevant roles.
  - Do not treat majority vote or persona confidence as evidence.
  - Preserve unresolved disagreements.
  - do not force consensus.
  - Do not claim persona consensus is product agent orchestration or sign-off.
  - Local eval required before production use.
caveat: >-
  For panel review, treat personas as simulated perspectives, not expertise, consensus,
  or sign-off. simulated reviewers can improve perspective coverage, but they are not
  independent experts. For formal decision prep with explicit critique, see Expert Panel
  Discussion. prefer Self-Refine or Chain-of-Verification when verification is the goal;
  use this pattern when perspective coverage itself is the deliverable. For lightweight
  exploratory brainstorming, see PanelGPT. Not a replacement for real expertise. For
  production multi-agent systems, follow official agent framework docs (tools, handoffs,
  evals) rather than persona roleplay alone.
definition: >-
  Host a simulated multi-persona panel to review a question and produce a bounded
  recommendation. Paste-first Panel Review collects task-relevant perspectives without
  fake authority. PanelGPT simulates reviewer personas to inspect risks, options,
  evidence gaps, and tradeoffs. Expert Panel Discussion is a more formal simulated
  expert-role discussion with independent positions, critique, and synthesis.
avoid_when: >-
  synthetic consensus would be mistaken for expert review or when a simpler verification
  pass is enough. the output needs domain-certified advice, stakeholder approval, or a
  cheap single-pass answer.
model_api_controls: >-
  retrieval/citations, structured evidence fields, and review gates for factual or
  high-stakes work. Label outputs as simulated panel critique; production multi-agent
  work needs official agent/tool/eval controls. source requirements, structured evidence
  fields, review gate, decision log. Simulated multi-persona panels are NOT official
  multi-agent product APIs (OpenAI Agents handoffs/tools); do not invent product
  orchestration claims from panel roleplay.
cost_latency: moderate.
failure_modes: >-
  fabricated expertise, irrelevant roles, groupthink, false authority, unsupported
  consensus. roleplay verbosity, false authority, unsupported consensus, groupthink,
  conflating simulated panels with production agent frameworks.
eval_required: true
sources:
