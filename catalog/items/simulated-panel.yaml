    url: https://aclanthology.org/2024.findings-emnlp.888/
  - title: OpenAI agents guardrails and approvals
    url: https://developers.openai.com/api/docs/guides/agents/guardrails-approvals
  - title: OpenAI evaluation best practices
    url: https://developers.openai.com/api/docs/guides/evaluation-best-practices
  - title: The Prompt Report
    url: https://arxiv.org/abs/2406.06608
  - title: Prompting Science Report 1
