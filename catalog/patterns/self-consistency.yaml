slug: self-consistency
title: Self-Consistency
section: verification-and-iteration
order: 10
definition: "sample multiple solution attempts and choose the answer with strongest agreement."
best_use: "high-value reasoning where independent attempts reduce variance."
avoid_when: "token cost is constrained or factual claims need external evidence."
template: |
  Problem:
  <input>
  {problem}
  </input>
  
  Solve the problem three independent ways using private reasoning.
  Compare final answers.
  Return:
  - consensus answer
  - disagreements
  - confidence with reason
  - checks performed
template_omission_reason: null
model_api_controls: |
  Independent sampled calls with temperature/top_p where supported; do not confuse multi-sample
  consensus with provider reasoning/thinking controls (OpenAI reasoning effort, Anthropic
  extended thinking, Gemini thinking, xAI reasoning). Prefer private reasoning per sample and a
  structured final vote schema. Measure cost against eval sets before defaulting to k-samples.
cost_latency: high.
failure_modes: |
  correlated errors, false consensus, unsupported confidence, treating vote agreement as
  factual truth, burning tokens when a single reasoning-control call plus checks would suffice.
evidence_tier: "**Strong** for reasoning benchmarks, task-sensitive in production."
source_type: "primary research plus survey."
eval_required: true
caveat: |
  Agreement is not truth; factual claims still need sources or tools. Compare multi-sample
  self-consistency against provider reasoning controls on your regression set before shipping.
sources:
  - title: "Self-Consistency Improves Chain of Thought"
    url: https://arxiv.org/abs/2203.11171
  - title: "OpenAI reasoning guide"
    url: https://developers.openai.com/api/docs/guides/reasoning
  - title: "OpenAI evaluation best practices"
    url: https://developers.openai.com/api/docs/guides/evaluation-best-practices
  - title: "The Prompt Report"
    url: https://arxiv.org/abs/2406.06608
