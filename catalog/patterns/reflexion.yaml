slug: reflexion
title: Reflexion
section: verification-and-iteration
order: 50
definition: "use concrete feedback from previous attempts to improve later attempts."
best_use: |
  agent tasks, coding loops, and workflows with observable failures.
avoid_when: "there is no reliable feedback signal."
template: |
  Attempt the task.
  Record concrete failure evidence from tests, logs, tool output, or user feedback.
  Create a revised strategy.
  Retry only the parts affected by the failure.
  Preserve the prompt/model/tool versions used.
template_omission_reason: null
model_api_controls: |
  Bound memory scope, retry budget, and tool permissions. Treat tool logs and test output as
  untrusted data until validated. Version prompt/model/tool state between attempts. Gate promotion
  of a revised strategy with regression evals (official evaluation best practices / trace grading
  surfaces)—do not promote on self-praise alone.
cost_latency: "high for full loops."
failure_modes: |
  unsupported introspection, repeating mistakes, stale memory, treating model self-critique as
  observation, unbounded retries without an eval stop rule.
evidence_tier: Moderate
source_type: "primary research plus survey."
eval_required: true
caveat: |
  Reflection must cite external observations (tests, tools, logs), not model self-belief.
  Without a reliable feedback signal and an eval gate, the loop is theater.
sources:
  - title: Reflexion
    url: https://arxiv.org/abs/2303.11366
  - title: "OpenAI evaluation best practices"
    url: https://developers.openai.com/api/docs/guides/evaluation-best-practices
  - title: "OpenAI trace grading"
    url: https://developers.openai.com/api/docs/guides/trace-grading
  - title: "The Prompt Report"
    url: https://arxiv.org/abs/2406.06608
