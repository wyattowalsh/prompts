slug: active-prompt
title: Active-Prompt
section: core-prompt-construction
order: 80
definition: |
  select uncertain examples, annotate them, and use them as task-specific demonstrations.
best_use: "known reasoning or classification tasks with a candidate pool and annotation budget."
avoid_when: |
  there is no example pool, annotation process, or eval set.
template: |
  Given candidate cases, identify cases where model outputs disagree most.
  Prioritize those cases for human annotation.
  Use the annotated examples as demonstrations for the final task.
  Return concise rationales only when useful for the evaluator.
template_omission_reason: null
model_api_controls: |
  Keep demonstration format aligned with the target model and output contract. Prefer structured
  labels when demos are machine-scored. Measure uncertainty with independent samples or grader
  disagreement, then lock the final exemplar set behind a held-out eval (evaluation best practices).
cost_latency: |
  high upfront, lower during inference after examples are selected.
failure_modes: |
  mislabeled exemplars, selection bias, stale examples, skipping held-out eval after annotation,
  leaking test cases into the demo pool.
evidence_tier: Moderate
source_type: "primary research plus survey."
eval_required: true
caveat: |
  This is a data/annotation workflow, not a single magic prompt. Without an annotation budget and
  a regression set, active selection is not operational.
sources:
  - title: "Active Prompting with Chain-of-Thought"
    url: https://arxiv.org/abs/2302.12246
  - title: "OpenAI evaluation best practices"
    url: https://developers.openai.com/api/docs/guides/evaluation-best-practices
  - title: "OpenAI prompt engineering"
    url: https://developers.openai.com/api/docs/guides/prompt-engineering
  - title: "The Prompt Report"
    url: https://arxiv.org/abs/2406.06608
