name: Dependency Audit

on:
  pull_request:
    paths:
      - .github/dependabot.yml
      - .github/workflows/dependency-audit.yml
      - .node-version
      - package.json
      - packages/*/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/check_dependency_policy.test.mjs
      - web/package.json
  push:
    branches:
      - main
    paths:
      - .github/dependabot.yml
      - .github/workflows/dependency-audit.yml
      - .node-version
      - package.json
      - packages/*/package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - scripts/check_dependency_policy.test.mjs
      - web/package.json
  schedule:
    - cron: "23 9 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: Advisories and package signatures
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record lockfile identity
        id: lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dependency-audit-evidence
          digest="$(sha256sum pnpm-lock.yaml | cut -d ' ' -f 1)"
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              evidence_trust_context="untrusted-pull-request-feedback"
              ;;
            push)
              if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
                evidence_trust_context="canonical-main-push"
              else
                evidence_trust_context="non-main-push-feedback"
              fi
              ;;
            schedule)
              evidence_trust_context="scheduled-repository-audit"
              ;;
            workflow_dispatch)
              evidence_trust_context="manual-repository-audit"
              ;;
            *)
              evidence_trust_context="unclassified"
              ;;
          esac
          printf 'sha256=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          {
            printf 'repository=%s\n' "$GITHUB_REPOSITORY"
            printf 'commit=%s\n' "$GITHUB_SHA"
            printf 'ref=%s\n' "$GITHUB_REF"
            printf 'head_ref=%s\n' "${GITHUB_HEAD_REF:-}"
            printf 'base_ref=%s\n' "${GITHUB_BASE_REF:-}"
            printf 'lockfile=pnpm-lock.yaml\n'
            printf 'lockfile_sha256=%s\n' "$digest"
            printf 'event=%s\n' "$GITHUB_EVENT_NAME"
            printf 'evidence_trust_context=%s\n' "$evidence_trust_context"
            printf 'run_id=%s\n' "$GITHUB_RUN_ID"
            printf 'run_attempt=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'started_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > dependency-audit-evidence/identity.txt

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies without lifecycle scripts
        id: install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Audit production dependency severity
        id: audit_prod
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm audit --prod --audit-level high 2>&1 | tee dependency-audit-evidence/audit-production.log

      - name: Audit complete dependency severity
        id: audit_all
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm audit --audit-level high 2>&1 | tee dependency-audit-evidence/audit-complete.log

      - name: Verify registry signatures
        id: signatures
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm audit signatures 2>&1 | tee dependency-audit-evidence/signatures.log

      - name: Summarize dependency audit evidence
        if: ${{ always() }}
        shell: bash
        env:
          JOB_STATUS: ${{ job.status }}
          LOCKFILE_SHA256: ${{ steps.lockfile.outputs.sha256 || 'unavailable' }}
          INSTALL_OUTCOME: ${{ steps.install.outcome || 'not-run' }}
          PROD_AUDIT_OUTCOME: ${{ steps.audit_prod.outcome || 'not-run' }}
          COMPLETE_AUDIT_OUTCOME: ${{ steps.audit_all.outcome || 'not-run' }}
          SIGNATURE_OUTCOME: ${{ steps.signatures.outcome || 'not-run' }}
        run: |
          mkdir -p dependency-audit-evidence
          {
            printf 'pre_upload_job_status=%s\n' "$JOB_STATUS"
            printf 'install_outcome=%s\n' "$INSTALL_OUTCOME"
            printf 'production_audit_outcome=%s\n' "$PROD_AUDIT_OUTCOME"
            printf 'complete_audit_outcome=%s\n' "$COMPLETE_AUDIT_OUTCOME"
            printf 'signature_outcome=%s\n' "$SIGNATURE_OUTCOME"
            printf 'completed_at=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> dependency-audit-evidence/identity.txt
          {
            printf '### Dependency audit evidence\n\n'
            printf -- '- Commit: <code>%s</code>\n' "$GITHUB_SHA"
            printf -- '- Lockfile SHA-256: <code>%s</code>\n' "$LOCKFILE_SHA256"
            printf -- '- Pre-upload job status: <code>%s</code>\n' "$JOB_STATUS"
            printf -- '- Install: <code>%s</code>\n' "$INSTALL_OUTCOME"
            printf -- '- Production audit: <code>%s</code>\n' "$PROD_AUDIT_OUTCOME"
            printf -- '- Complete audit: <code>%s</code>\n' "$COMPLETE_AUDIT_OUTCOME"
            printf -- '- Registry signatures: <code>%s</code>\n' "$SIGNATURE_OUTCOME"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Retain dependency audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-audit-${{ github.sha }}-${{ steps.lockfile.outputs.sha256 || 'unavailable' }}
          path: dependency-audit-evidence/
          if-no-files-found: error
          retention-days: 30
