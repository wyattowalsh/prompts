name: README Quality

on:
  pull_request:
    paths:
      - README.md
      - AGENTS.md
      - DESIGN.md
      - CHANGELOG.md
      - source-refresh.md
      - .agents/skills/readme-catalog-steward/**
      - .markdown-link-check.json
      - scripts/check_readme_recipes.py
      - scripts/audit_paste_zone_cells.py
      - scripts/hoist_paste_preview.py
      - scripts/format_recipe_catalog.py
      - scripts/update_readme_badges.py
      - scripts/check_sources_manifest.py
      - scripts/check_catalog_readme.mjs
      - scripts/check_catalog_readme.test.mjs
      - scripts/catalog_badge_data.mjs
      - scripts/catalog_readme.mjs
      - scripts/render_readme_chrome.mjs
      - scripts/check_ci_action_pins.mjs
      - scripts/check_ci_action_pins.test.mjs
      - scripts/check_dependency_policy.test.mjs
      - scripts/check_markdown_links.mjs
      - scripts/check_markdown_links.test.mjs
      - scripts/check_toolchain.mjs
      - scripts/check_toolchain.test.mjs
      - scripts/list_validation_files.mjs
      - scripts/list_validation_files.test.mjs
      - scripts/run_playwright.mjs
      - scripts/run_playwright.test.mjs
      - scripts/serve_dist.mjs
      - scripts/serve_dist.test.mjs
      - scripts/catalog_constants.py
      - scripts/recipe_heading.py
      - scripts/check_badge_urls.sh
      - scripts/check_badge_urls.test.mjs
      - sources.yaml
      - LICENSE
      - CONTRIBUTING.md
      - SECURITY.md
      - CODE_OF_CONDUCT.md
      - web/**
      - catalog/**
      - goals/**
      - openspec/**
      - packages/catalog-core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vercel.json
      - eslint.config.js
      - prettier.config.cjs
      - playwright.config.mjs
      - justfile
      - tests/**
      - .pre-commit-config.yaml
      - .gitignore
      - .node-version
      - .github/**
  push:
    branches:
      - main
    paths:
      - README.md
      - AGENTS.md
      - DESIGN.md
      - CHANGELOG.md
      - source-refresh.md
      - .agents/skills/readme-catalog-steward/**
      - .markdown-link-check.json
      - scripts/check_readme_recipes.py
      - scripts/audit_paste_zone_cells.py
      - scripts/hoist_paste_preview.py
      - scripts/format_recipe_catalog.py
      - scripts/update_readme_badges.py
      - scripts/check_sources_manifest.py
      - scripts/check_catalog_readme.mjs
      - scripts/check_catalog_readme.test.mjs
      - scripts/catalog_badge_data.mjs
      - scripts/catalog_readme.mjs
      - scripts/render_readme_chrome.mjs
      - scripts/check_ci_action_pins.mjs
      - scripts/check_ci_action_pins.test.mjs
      - scripts/check_dependency_policy.test.mjs
      - scripts/check_markdown_links.mjs
      - scripts/check_markdown_links.test.mjs
      - scripts/check_toolchain.mjs
      - scripts/check_toolchain.test.mjs
      - scripts/list_validation_files.mjs
      - scripts/list_validation_files.test.mjs
      - scripts/run_playwright.mjs
      - scripts/run_playwright.test.mjs
      - scripts/serve_dist.mjs
      - scripts/serve_dist.test.mjs
      - scripts/catalog_constants.py
      - scripts/recipe_heading.py
      - scripts/check_badge_urls.sh
      - scripts/check_badge_urls.test.mjs
      - sources.yaml
      - LICENSE
      - CONTRIBUTING.md
      - SECURITY.md
      - CODE_OF_CONDUCT.md
      - web/**
      - catalog/**
      - goals/**
      - openspec/**
      - packages/catalog-core/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - vercel.json
      - eslint.config.js
      - prettier.config.cjs
      - playwright.config.mjs
      - justfile
      - tests/**
      - .pre-commit-config.yaml
      - .gitignore
      - .node-version
      - .github/**
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  readme-quality:
    name: Markdown, links, badges, sources, and web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Verify toolchain versions
        shell: bash
        run: pnpm run toolchain:check

      - name: Install JS dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Catalog validate and unit tests
        shell: bash
        run: |
          pnpm catalog:validate
          pnpm catalog:site-data:check
          pnpm catalog:test

      - name: Catalog README drift check
        shell: bash
        run: pnpm catalog:readme:check

      - name: Catalog README chrome hash check
        shell: bash
        run: pnpm catalog:readme-chrome:check

      - name: Recipe contract check
        shell: bash
        run: python3 scripts/check_readme_recipes.py --readme README.md --check

      - name: Paste-zone cell audit
        shell: bash
        run: python3 scripts/audit_paste_zone_cells.py --check --strict-warn

      - name: Unit tests
        shell: bash
        run: python3 -m unittest discover -s tests -v

      - name: Source manifest check
        shell: bash
        run: python3 scripts/check_sources_manifest.py --check

      - name: Generated badge check
        shell: bash
        env:
          PYTHONPYCACHEPREFIX: /tmp/prompts-pycache
        run: |
          python3 scripts/update_readme_badges.py --check
          python3 -m py_compile \
            scripts/catalog_constants.py \
            scripts/recipe_heading.py \
            scripts/update_readme_badges.py \
            scripts/check_readme_recipes.py \
            scripts/audit_paste_zone_cells.py \
            scripts/hoist_paste_preview.py \
            scripts/format_recipe_catalog.py \
            scripts/check_sources_manifest.py

      - name: Markdown lint
        shell: bash
        run: |
          DOCS=(
            README.md
            AGENTS.md
            DESIGN.md
            CHANGELOG.md
            .agents/skills/readme-catalog-steward/SKILL.md
            .agents/skills/readme-catalog-steward/references/*.md
            source-refresh.md
            goals/codebase-sota-improvement/scratch/a11y-defer.md
            goals/codebase-sota-improvement/scratch/cb-closeout-residual.md
            goals/codebase-sota-improvement/scratch/residual-register.md
            goals/prompt-catalog-research-upgrade/hygiene-report.md
            goals/web-design-sota-enrich/goal.md
          )
          while IFS= read -r file; do DOCS+=("$file"); done < <(
            git ls-files --cached --others --exclude-standard -- \
              CONTRIBUTING.md SECURITY.md CODE_OF_CONDUCT.md
          )
          while IFS= read -r file; do DOCS+=("$file"); done < <(
            git ls-files --cached --others --exclude-standard -- \
              'openspec/specs/**/*.md' 'openspec/changes/**/*.md' \
              ':(exclude)openspec/changes/archive/**'
          )
          pnpm exec markdownlint-cli2 "${DOCS[@]}"

      - name: Link check
        shell: bash
        run: pnpm run docs:links

      - name: Skill eval JSON syntax
        shell: bash
        run: |
          python3 -m json.tool .agents/skills/readme-catalog-steward/evals/evals.json >/dev/null
          python3 -m json.tool .agents/skills/readme-catalog-steward/evals/adversarial-fixtures.json >/dev/null
          python3 -m json.tool .markdown-link-check.json >/dev/null

      - name: Workflow and config syntax
        shell: bash
        run: |
          pnpm run ci:action-pins
          pnpm run ci:dependency-policy
          pnpm run validation-files:test
          pnpm exec js-yaml .github/workflows/readme-quality.yml >/dev/null
          pnpm exec js-yaml .github/workflows/dependency-audit.yml >/dev/null
          pnpm exec js-yaml .github/dependabot.yml >/dev/null
          pnpm exec js-yaml .pre-commit-config.yaml >/dev/null
          python3 -m json.tool .markdown-link-check.json >/dev/null
          python3 -m json.tool vercel.json >/dev/null

      - name: Validate OpenSpec contracts
        shell: bash
        run: pnpm exec openspec validate --all --strict --no-interactive --json

      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.1"
          cache: false

      - name: Validate GitHub Actions semantics
        shell: bash
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          actionlint

      - name: Web lint, unit tests, and build
        shell: bash
        run: |
          pnpm run lint
          pnpm run format:check
          pnpm run web:test
          pnpm run web:build

      - name: Install Playwright Chromium
        shell: bash
        run: pnpm exec playwright install --with-deps chromium

      - name: Web browser smoke
        shell: bash
        run: pnpm run web:test:browser -- --trace=retain-on-failure --screenshot=only-on-failure

      - name: Retain browser failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Whitespace check
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          DOCS=(
            README.md
            AGENTS.md
            DESIGN.md
            CHANGELOG.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            .agents/skills/readme-catalog-steward/SKILL.md
            .agents/skills/readme-catalog-steward/references/*.md
            source-refresh.md
          )
          PATHS=(
            "${DOCS[@]}"
            .agents/skills/readme-catalog-steward/evals/evals.json
            .agents/skills/readme-catalog-steward/evals/adversarial-fixtures.json
            .markdown-link-check.json
            .pre-commit-config.yaml
            .gitignore
            .node-version
            .github
            catalog
            goals
            openspec
            package.json
            packages/catalog-core
            pnpm-lock.yaml
            pnpm-workspace.yaml
            vercel.json
            eslint.config.js
            prettier.config.cjs
            playwright.config.mjs
            justfile
            web
            scripts
            tests
            sources.yaml
            LICENSE
          )
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            git diff --check "${BASE}...HEAD" -- "${PATHS[@]}"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "${{ github.event.before }}...HEAD" -- "${PATHS[@]}"
          else
            # Fallback for first push / manual runs: check working tree (clean checkout is a no-op).
            git diff --check -- "${PATHS[@]}"
          fi

      - name: Badge URL smoke check
        shell: bash
        run: pnpm run badges:urls
