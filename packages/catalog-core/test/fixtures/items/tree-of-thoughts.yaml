slug: tree-of-thoughts
title: Tree-of-Thoughts
lane: reasoning
blurb: Explore multiple intermediate reasoning branches, evaluate them, and search toward a better final answer.
order: 80
badge:
  logo: "ri:RiNodeTree"
  color: "8B5CF6"
  chip_label: ToT
evidence: Primary research paper.
safety:
  - Cap breadth and depth; do not treat branch scores as external proof.
caveat: Branch scores are model-internal unless you add external verifiers.
definition: |
  Explore multiple intermediate reasoning branches, evaluate them, and search
  toward a better final answer instead of a single linear chain.
avoid_when: |
  Simple factual lookup, latency-sensitive paths, or when branch evaluation is unreliable.
model_api_controls: |
  Higher reasoning effort can help; cap breadth/depth for cost.
cost_latency: |
  Multiplies tokens versus single-pass answers; bound K and depth.
failure_modes: |
  Shallow scoring, thrashing, or inventing branch quality without checks.
eval_required: true
sources:
  - title: Tree of Thoughts
    url: https://arxiv.org/abs/2305.10601
modes:
  - id: search
    label: Search
    default: true
    when_to_use: Planning, multi-step puzzles, and tasks where early commitment is costly.
    placeholders: []
    prompt: |
      Generate K candidate next steps. Score each. Expand the best branches. Return the best path.
